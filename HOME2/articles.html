<!-- v3.4: 기본값 전체 지정, 중복 항목 제거, 모바일 최적화 글 목록 레이아웃 -->
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>촛불회보 기고문 아카이브</title>
    <style>
        body {
            font-family: 'Segoe UI', AppleSDGothicNeo, sans-serif;
            max-width: 1000px;
            margin: 40px auto;
            padding: 20px;
            line-height: 1.6;
            color: #333;
            background-color: #f9fafb;
            word-break: keep-all;
        }
        h1 {
            text-align: center;
            color: #1f2937;
            margin-bottom: 10px;
        }
        .version-badge {
            font-size: 14px;
            font-weight: normal;
            color: #6b7280;
            margin-left: 8px;
        }
        p.subtitle {
            text-align: center;
            color: #6b7280;
            margin-bottom: 30px;
        }
        .home-btn-container {
            margin-bottom: 20px;
        }
        .home-btn {
            display: inline-block;
            padding: 8px 16px;
            background-color: #f3f4f6;
            color: #374151;
            text-decoration: none;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 600;
            border: 1px solid #d1d5db;
            transition: background-color 0.15s;
        }
        .home-btn:hover {
            background-color: #e5e7eb;
        }
        /* 3열 필터 레이아웃 */
        .filter-container {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            background: #ffffff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
            margin-bottom: 25px;
        }
        .filter-group {
            width: 100%;
        }
        label {
            font-weight: 600;
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            color: #4b5563;
        }
        select {
            width: 100%;
            padding: 10px 12px;
            border-radius: 6px;
            border: 1px solid #d1d5db;
            font-size: 15px;
            background-color: #fff;
            transition: border-color 0.15s ease-in-out;
        }
        select:focus {
            border-color: #2563eb;
            outline: none;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        }
        select:disabled {
            background-color: #f3f4f6;
            cursor: not-allowed;
        }
        /* 하단 글 목록 리스트 스타일 (모바일 두 줄 방지 축약형) */
        .list-container {
            background: #ffffff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
            margin-bottom: 25px;
            border: 1px solid #e5e7eb;
        }
        .list-container h3 {
            margin-top: 0;
            font-size: 16px;
            color: #1f2937;
            margin-bottom: 12px;
            border-bottom: 2px solid #f3f4f6;
            padding-bottom: 8px;
        }
        .article-list {
            list-style: none;
            padding: 0;
            margin: 0;
            max-height: 250px;
            overflow-y: auto;
        }
        .article-item {
            padding: 8px 12px;
            border-radius: 6px;
            cursor: pointer;
            transition: background-color 0.15s;
            margin-bottom: 4px;
            border: 1px solid transparent;
            font-size: 14px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .article-item:hover {
            background-color: #f3f4f6;
            border-color: #e5e7eb;
        }
        .article-item.active {
            background-color: #eff6ff;
            border-color: #bfdbfe;
            color: #1d4ed8;
            font-weight: 600;
        }
        /* 전문 출력 영역 */
        #articleViewer {
            background: #ffffff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
            border: 1px solid #e5e7eb;
        }
        .meta-info {
            font-size: 14px;
            color: #4b5563;
            background-color: #f3f4f6;
            padding: 12px 16px;
            border-radius: 6px;
            margin-bottom: 20px;
            border-left: 4px solid #2563eb;
            display: none;
        }
        #contentBody {
            white-space: pre-wrap;
            font-size: 16px;
            color: #1f2937;
            line-height: 1.8;
        }
        .placeholder-text {
            color: #9ca3af;
            text-align: center;
            padding: 40px 0;
        }
        /* 반응형: PC와 모바일 모두 3열 유지 및 모바일 최적화 */
        @media (max-width: 768px) {
            body {
                padding: 10px;
                margin: 10px auto;
            }
            .filter-container {
                grid-template-columns: repeat(3, 1fr);
                gap: 6px;
                padding: 10px;
            }
            label {
                font-size: 11px;
                margin-bottom: 4px;
            }
            select {
                padding: 6px 4px;
                font-size: 12px;
            }
            #articleViewer {
                padding: 15px;
            }
        }
    </style>
</head>
<body>

    <!-- 메인으로 돌아가는 홈 버튼 -->
    <div class="home-btn-container">
        <a href="../index.html" class="home-btn">← 메인으로 돌아가기</a>
    </div>

    <h1>촛불회보 기고문 아카이브 <span class="version-badge">v3.4</span></h1>
    <p class="subtitle">글 종류, 기수, 기고자 조건을 선택하여 해당 글 목록을 확인하세요.</p>

    <!-- 3열 배치형 필터 박스 -->
    <div class="filter-container">
        <!-- 1단계: 글 종류 선택 -->
        <div class="filter-group">
            <label for="typeSelect">1. 글 종류</label>
            <select id="typeSelect" disabled>
                <option value="전체">불러오는 중...</option>
            </select>
        </div>

        <!-- 2단계: 기수 선택 -->
        <div class="filter-group">
            <label for="cohortSelect">2. 기수</label>
            <select id="cohortSelect" disabled>
                <option value="전체">전체</option>
            </select>
        </div>

        <!-- 3단계: 기고자 선택 -->
        <div class="filter-group">
            <label for="authorSelect">3. 기고자</label>
            <select id="authorSelect" disabled>
                <option value="전체">전체</option>
            </select>
        </div>
    </div>

    <!-- 조건에 맞는 글 목록 출력 영역 -->
    <div class="list-container" id="listContainer">
        <h3 id="listTitle">검색된 글 목록</h3>
        <ul class="article-list" id="articleList"></ul>
    </div>

    <!-- 기고문 전문 출력 영역 -->
    <div id="articleViewer">
        <div class="meta-info" id="metaInfo"></div>
        <div id="contentBody" class="placeholder-text">목록에서 글을 선택하시면 전문이 표시됩니다.</div>
    </div>

    <script>
        const SHEET_CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTCB2tSuKXLH-2oeMVcSZ59yVgjmkTVxS4941EUpNhsVI1c3cNI2Cl73UJ1Sl533YgjOuqAUPATfyVv/pub?gid=339193703&single=true&output=csv';
        
        let articlesData = [];

        const typeSelect = document.getElementById('typeSelect');
        const cohortSelect = document.getElementById('cohortSelect');
        const authorSelect = document.getElementById('authorSelect');
        const listContainer = document.getElementById('listContainer');
        const listTitle = document.getElementById('listTitle');
        const articleList = document.getElementById('articleList');
        const metaInfo = document.getElementById('metaInfo');
        const contentBody = document.getElementById('contentBody');

        function parseCSV(text) {
            let lines = [];
            let row = [''];
            let inQuotes = false;

            for (let i = 0; i < text.length; i++) {
                let c = text[i];
                let nextC = text[i + 1];

                if (c === '"') {
                    if (inQuotes && nextC === '"') {
                        row[row.length - 1] += '"';
                        i++;
                    } else {
                        inQuotes = !inQuotes;
                    }
                } else if (c === ',' && !inQuotes) {
                    row.push('');
                } else if ((c === '\r' && nextC === '\n') && !inQuotes) {
                    lines.push(row);
                    row = [''];
                    i++;
                } else if (c === '\n' && !inQuotes) {
                    lines.push(row);
                    row = [''];
                } else {
                    row[row.length - 1] += c;
                }
            }
            if (row.length > 1 || row[0] !== '') {
                lines.push(row);
            }

            const result = [];
            for (let i = 1; i < lines.length; i++) {
                const r = lines[i];
                if (r.length >= 8 && r[0].trim() !== '') {
                    result.push({
                        id: r[0].trim(),
                        vol: r[1] ? r[1].trim() : '',
                        date: r[2] ? r[2].trim() : '',
                        cohort: r[3] ? r[3].trim() : '',
                        author: r[4] ? r[4].trim() : '',
                        type: r[5] ? r[5].trim() : '',
                        title: r[6] ? r[6].trim() : '',
                        content: r[7] ? r[7].trim() : ''
                    });
                }
            }
            return result;
        }

        async function loadSheetData() {
            try {
                const response = await fetch(SHEET_CSV_URL);
                const csvText = await response.text();
                articlesData = parseCSV(csvText);
                initDropdowns();
            } catch (error) {
                contentBody.textContent = '구글 시트 데이터를 불러오는 데 실패했습니다. 네트워크 연결을 확인해주세요.';
                console.error(error);
            }
        }

        // 초기 드롭다운 설정 (기본값 '전체')
        function initDropdowns() {
            typeSelect.innerHTML = '<option value="전체">전체</option>';
            const types = [...new Set(articlesData.map(item => item.type))].filter(Boolean).sort();
            
            types.forEach(type => {
                const option = document.createElement('option');
                option.value = type;
                option.textContent = type;
                typeSelect.appendChild(option);
            });

            typeSelect.value = "전체";
            typeSelect.disabled = false;
            cohortSelect.disabled = false;
            authorSelect.disabled = false;

            updateFilters();
        }

        // 연쇄 필터링 업데이트 함수
        function updateFilters() {
            const selectedType = typeSelect.value;
            const selectedCohort = cohortSelect.value;
            const selectedAuthor = authorSelect.value;

            let currentPool = articlesData;
            if (selectedType && selectedType !== "전체") {
                currentPool = currentPool.filter(item => item.type === selectedType);
            }

            // 기수 목록 갱신
            const validCohorts = currentPool.map(item => item.cohort).filter(c => c && (/^\d+기$/.test(c) || c === '기록 없음'));
            const sortedCohorts = [...new Set(validCohorts)].sort((a, b) => {
                if (a === "기록 없음") return 1;
                if (b === "기록 없음") return -1;
                return parseInt(a) - parseInt(b);
            });

            cohortSelect.innerHTML = '<option value="전체">전체</option>';
            sortedCohorts.forEach(cohort => {
                const option = document.createElement('option');
                option.value = cohort;
                option.textContent = cohort;
                if (cohort === selectedCohort) option.selected = true;
                cohortSelect.appendChild(option);
            });

            if (!sortedCohorts.includes(selectedCohort) && selectedCohort !== "전체") {
                cohortSelect.value = "전체";
            }

            // 기고자 목록 갱신
            let authorPool = currentPool;
            if (cohortSelect.value && cohortSelect.value !== "전체") {
                authorPool = authorPool.filter(item => item.cohort === cohortSelect.value);
            }
            const sortedAuthors = [...new Set(authorPool.map(item => item.author))].filter(Boolean).sort();

            authorSelect.innerHTML = '<option value="전체">전체</option>';
            sortedAuthors.forEach(author => {
                const option = document.createElement('option');
                option.value = author;
                option.textContent = author;
                if (author === selectedAuthor) option.selected = true;
                authorSelect.appendChild(option);
            });

            if (!sortedAuthors.includes(selectedAuthor) && selectedAuthor !== "전체") {
                authorSelect.value = "전체";
            }

            renderArticleList();
        }

        // 하단 글 목록 렌더링 (제목 및 기고자만 간결하게 표시)
        function renderArticleList() {
            const selectedType = typeSelect.value;
            const selectedCohort = cohortSelect.value;
            const selectedAuthor = authorSelect.value;

            let filtered = articlesData;
            if (selectedType && selectedType !== "전체") {
                filtered = filtered.filter(item => item.type === selectedType);
            }
            if (selectedCohort && selectedCohort !== "전체") {
                filtered = filtered.filter(item => item.cohort === selectedCohort);
            }
            if (selectedAuthor && selectedAuthor !== "전체") {
                filtered = filtered.filter(item => item.author === selectedAuthor);
            }

            articleList.innerHTML = '';
            listTitle.textContent = `검색된 글 목록 (${filtered.length}건)`;

            if (filtered.length === 0) {
                articleList.innerHTML = '<li style="padding: 10px; color: #9ca3af; text-align: center;">조건에 일치하는 글이 없습니다.</li>';
                listContainer.style.display = 'block';
                return;
            }

            filtered.forEach(article => {
                const li = document.createElement('li');
                li.className = 'article-item';
                // 모바일 줄바꿈 방지를 위해 제목과 기고자만 짧게 표기
                li.textContent = `[${article.title}] - ${article.author}`;
                li.title = `[${article.title}] - ${article.author} (${article.cohort}, ${article.vol})`; // 툴팁으로 상세 정보 제공
                li.addEventListener('click', function() {
                    document.querySelectorAll('.article-item').forEach(el => el.classList.remove('active'));
                    li.classList.add('active');
                    showArticleDetail(article.id);
                });
                articleList.appendChild(li);
            });

            listContainer.style.display = 'block';
        }

        // 전문 뷰어 표시
        function showArticleDetail(id) {
            const article = articlesData.find(item => item.id === id);
            if (article) {
                metaInfo.style.display = 'block';
                metaInfo.innerHTML = `<strong>[${article.title}]</strong> | 발행: ${article.vol} (${article.date}) | 기수: ${article.cohort} | 기고자: ${article.author} | 종류: ${article.type} | 관리번호: ${article.id}`;
                contentBody.className = '';
                contentBody.textContent = article.content;
            }
        }

        typeSelect.addEventListener('change', () => {
            updateFilters();
            metaInfo.style.display = 'none';
            contentBody.className = 'placeholder-text';
            contentBody.textContent = '목록에서 글을 선택하시면 전문이 표시됩니다.';
        });

        cohortSelect.addEventListener('change', () => {
            updateFilters();
            metaInfo.style.display = 'none';
            contentBody.className = 'placeholder-text';
            contentBody.textContent = '목록에서 글을 선택하시면 전문이 표시됩니다.';
        });

        authorSelect.addEventListener('change', () => {
            renderArticleList();
            metaInfo.style.display = 'none';
            contentBody.className = 'placeholder-text';
            contentBody.textContent> = '목록에서 글을 선택하시면 전문이 표시됩니다.';
        });

        loadSheetData();
    </script>
</body>
</html>
