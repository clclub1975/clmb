<!-- v3.7: F열(글 종류) 동적 로딩 유지 및 목록 줄 간격 대폭 축소 -->
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>촛불회보 기고문 아카이브</title>
    <style>
        body {
            font-family: 'Segoe UI', AppleSDGothicNeo, sans-serif;
            max-width: 1000px;
            margin: 40px auto;
            padding: 20px;
            line-height: 1.6;
            color: #333;
            background-color: #f9fafb;
            word-break: keep-all;
        }
        h1 {
            text-align: center;
            color: #1f2937;
            margin-bottom: 10px;
        }
        .version-badge {
            font-size: 14px;
            font-weight: normal;
            color: #6b7280;
            margin-left: 8px;
        }
        p.subtitle {
            text-align: center;
            color: #6b7280;
            margin-bottom: 30px;
        }
        .home-btn-container {
            margin-bottom: 20px;
        }
        .home-btn {
            display: inline-block;
            padding: 8px 16px;
            background-color: #f3f4f6;
            color: #374151;
            text-decoration: none;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 600;
            border: 1px solid #d1d5db;
            transition: background-color 0.15s;
        }
        .home-btn:hover {
            background-color: #e5e7eb;
        }
        
        /* 3열 필터 레이아웃 */
        .filter-container {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            background: #ffffff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
            margin-bottom: 25px;
        }
        .filter-group {
            width: 100%;
        }
        label {
            font-weight: 600;
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            color: #4b5563;
        }
        select {
            width: 100%;
            padding: 10px 12px;
            border-radius: 6px;
            border: 1px solid #d1d5db;
            font-size: 15px;
            background-color: #fff;
            transition: border-color 0.15s ease-in-out;
        }
        select:focus {
            border-color: #2563eb;
            outline: none;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        }
        select:disabled {
            background-color: #f3f4f6;
            cursor: not-allowed;
        }
        
        /* 하단 글 목록 리스트 스타일 */
        .list-container {
            background: #ffffff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
            margin-bottom: 25px;
            border: 1px solid #e5e7eb;
        }
        .list-container h3 {
            margin-top: 0;
            font-size: 16px;
            color: #1f2937;
            margin-bottom: 12px;
            border-bottom: 2px solid #f3f4f6;
            padding-bottom: 8px;
        }
        .article-list {
            list-style: none;
            padding: 0;
            margin: 0;
            max-height: 300px;
            overflow-y: auto;
        }
        /* v3.7: 글 목록 간격을 본문 줄 간격(1.6) 수준으로 대폭 축소 */
        .article-item {
            padding: 2px 8px; 
            margin-bottom: 0px; 
            border-radius: 4px;
            cursor: pointer;
            transition: background-color 0.15s;
            border: 1px solid transparent;
            font-size: 14px;
            line-height: 1.6;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .article-item:hover {
            background-color: #f3f4f6;
            border-color: #e5e7eb;
        }
        .article-item.active {
            background-color: #eff6ff;
            border-color: #bfdbfe;
            color: #1d4ed8;
            font-weight: 600;
        }

        /* 전문 출력 영역 (PC 기본 스타일) */
        .viewer-content-box {
            background: #ffffff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
            border: 1px solid #e5e7eb;
            position: relative;
        }
        .close-btn {
            display: none;
        }
        .meta-info {
            font-size: 14px;
            color: #4b5563;
            background-color: #f3f4f6;
            padding: 12px 16px;
            border-radius: 6px;
            margin-bottom: 20px;
            border-left: 4px solid #2563eb;
            display: none;
        }
        #contentBody {
            white-space: pre-wrap;
            font-size: 16px;
            color: #1f2937;
            line-height: 1.8;
        }
        .placeholder-text {
            color: #9ca3af;
            text-align: center;
            padding: 40px 0;
        }

        /* 반응형: 모바일 모달 및 3열 유지 */
        @media (max-width: 768px) {
            body {
                padding: 10px;
                margin: 10px auto;
            }
            .filter-container {
                grid-template-columns: repeat(3, 1fr);
                gap: 6px;
                padding: 10px;
            }
            label {
                font-size: 11px;
                margin-bottom: 4px;
            }
            select {
                padding: 6px 4px;
                font-size: 12px;
            }
            
            /* 모바일 모달 창 */
            #articleViewer {
                display: none;
                position: fixed;
                top: 0; 
                left: 0; 
                width: 100%; 
                height: 100%;
                background-color: rgba(0, 0, 0, 0.6);
                z-index: 9999;
                padding: 15px;
                box-sizing: border-box;
                align-items: center;
                justify-content: center;
            }
            #articleViewer.open {
                display: flex;
            }
            .viewer-content-box {
                width: 100%;
                max-height: 90vh;
                overflow-y: auto;
                padding: 20px;
                background: #fff;
                border-radius: 8px;
                box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            }
            .close-btn {
                display: flex;
                justify-content: space-between;
                align-items: center;
                font-size: 15px;
                color: #374151;
                margin-bottom: 15px;
                padding-bottom: 10px;
                border-bottom: 1px solid #e5e7eb;
                cursor: pointer;
                font-weight: 600;
                position: sticky;
                top: 0;
                background: #fff;
            }
            .close-icon {
                color: #ef4444;
                font-size: 18px;
            }
        }
    </style>
</head>
<body>

    <div class="home-btn-container">
        <a href="../index.html" class="home-btn">← 메인으로 돌아가기</a>
    </div>

    <h1>촛불회보 기고문 아카이브 <span class="version-badge">v3.7</span></h1>
    <p class="subtitle">글 종류, 기수, 기고자 조건을 선택하여 해당 글 목록을 확인하세요.</p>

    <div class="filter-container">
        <div class="filter-group">
            <label for="typeSelect">1. 글 종류</label>
            <select id="typeSelect" disabled>
                <option value="전체">데이터 로딩 중...</option>
            </select>
        </div>
        <div class="filter-group">
            <label for="cohortSelect">2. 기수</label>
            <select id="cohortSelect" disabled>
                <option value="전체">전체</option>
            </select>
        </div>
        <div class="filter-group">
            <label for="authorSelect">3. 기고자</label>
            <select id="authorSelect" disabled>
                <option value="전체">전체</option>
            </select>
        </div>
    </div>

    <div class="list-container" id="listContainer" style="display:none;">
        <h3 id="listTitle">검색된 글 목록</h3>
        <ul class="article-list" id="articleList"></ul>
    </div>

    <div id="articleViewer">
        <div class="viewer-content-box">
            <div id="closeModalBtn" class="close-btn">
                <span>기록 보기</span>
                <span class="close-icon">✕ 닫기</span>
            </div>
            
            <div class="meta-info" id="metaInfo"></div>
            <div id="contentBody" class="placeholder-text">데이터를 불러오는 중입니다. 잠시만 기다려주세요.</div>
        </div>
    </div>

    <script>
        const SHEET_CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTCB2tSuKXLH-2oeMVcSZ59yVgjmkTVxS4941EUpNhsVI1c3cNI2Cl73UJ1Sl533YgjOuqAUPATfyVv/pub?gid=339193703&single=true&output=csv';
        
        let articlesData = [];

        const typeSelect = document.getElementById('typeSelect');
        const cohortSelect = document.getElementById('cohortSelect');
        const authorSelect = document.getElementById('authorSelect');
        const listContainer = document.getElementById('listContainer');
        const listTitle = document.getElementById('listTitle');
        const articleList = document.getElementById('articleList');
        const metaInfo = document.getElementById('metaInfo');
        const contentBody = document.getElementById('contentBody');
        const articleViewer = document.getElementById('articleViewer');
        const closeModalBtn = document.getElementById('closeModalBtn');

        closeModalBtn.addEventListener('click', () => {
            articleViewer.classList.remove('open');
        });

        function fastParseCSV(text) {
            const articles = [];
            let start = 0;
            let inQuotes = false;
            let row = [];
            if (!text.endsWith('\n')) text += '\n';

            for (let i = 0; i < text.length; i++) {
                if (text[i] === '"') {
                    inQuotes = !inQuotes;
                } else if ((text[i] === ',' || text[i] === '\n') && !inQuotes) {
                    let val = text.substring(start, i);
                    if (val.endsWith('\r')) val = val.slice(0, -1);
                    if (val.startsWith('"') && val.endsWith('"') && val.length >= 2) {
                        val = val.substring(1, val.length - 1).replace(/""/g, '"');
                    }
                    row.push(val.trim());
                    
                    if (text[i] === '\n') {
                        // row[5]가 바로 구글 시트의 F열(글 종류) 데이터를 의미합니다.
                        if (row.length >= 8 && row[0] !== '' && !row[0].includes('관리 ID')) {
                            articles.push({
                                id: row[0], vol: row[1], date: row[2], cohort: row[3], 
                                author: row[4], type: row[5], title: row[6], content: row[7]
                            });
                        }
                        row = [];
                    }
                    start = i + 1;
                }
            }
            return articles;
        }

        async function loadSheetData() {
            try {
                const response = await fetch(SHEET_CSV_URL);
                const csvText = await response.text();
                articlesData = fastParseCSV(csvText);
                initDropdowns();
                contentBody.textContent = '상단에서 조건을 선택하시거나 글 목록에서 항목을 클릭하세요.';
            } catch (error) {
                contentBody.textContent = '구글 시트 데이터를 불러오는 데 실패했습니다. 네트워크 연결을 확인해주세요.';
                console.error(error);
            }
        }

        function initDropdowns() {
            typeSelect.innerHTML = '<option value="전체">전체</option>';
            
            // F열(item.type)에서 중복을 제거하고 정렬하여 글 종류 드롭다운 구성
            const types = [...new Set(articlesData.map(item => item.type))].filter(Boolean).sort();
            
            const fragment = document.createDocumentFragment();
            types.forEach(type => {
                const option = document.createElement('option');
                option.value = type;
                option.textContent = type;
                fragment.appendChild(option);
            });
            typeSelect.appendChild(fragment);

            typeSelect.value = "전체";
            typeSelect.disabled = false;
            cohortSelect.disabled = false;
            authorSelect.disabled = false;

            updateFilters();
        }

        function updateFilters() {
            const selectedType = typeSelect.value;
            const selectedCohort = cohortSelect.value;
            const selectedAuthor = authorSelect.value;

            let currentPool = articlesData;
            if (selectedType && selectedType !== "전체") {
                currentPool = currentPool.filter(item => item.type === selectedType);
            }

            const validCohorts = currentPool.map(item => item.cohort).filter(c => c && (/^\d+기$/.test(c) || c === '기록 없음'));
            const sortedCohorts = [...new Set(validCohorts)].sort((a, b) => {
                if (a === "기록 없음") return 1;
                if (b === "기록 없음") return -1;
                return parseInt(a) - parseInt(b);
            });

            cohortSelect.innerHTML = '<option value="전체">전체</option>';
            const cohortFragment = document.createDocumentFragment();
            sortedCohorts.forEach(cohort => {
                const option = document.createElement('option');
                option.value = cohort;
                option.textContent = cohort;
                if (cohort === selectedCohort) option.selected = true;
                cohortFragment.appendChild(option);
            });
            cohortSelect.appendChild(cohortFragment);

            if (!sortedCohorts.includes(selectedCohort) && selectedCohort !== "전체") {
                cohortSelect.value = "전체";
            }

            let authorPool = currentPool;
            if (cohortSelect.value && cohortSelect.value !== "전체") {
                authorPool = authorPool.filter(item => item.cohort === cohortSelect.value);
            }
            const sortedAuthors = [...new Set(authorPool.map(item => item.author))].filter(Boolean).sort();

            authorSelect.innerHTML = '<option value="전체">전체</option>';
            const authorFragment = document.createDocumentFragment();
            sortedAuthors.forEach(author => {
                const option = document.createElement('option');
                option.value = author;
                option.textContent = author;
                if (author === selectedAuthor) option.selected = true;
                authorFragment.appendChild(option);
            });
            authorSelect.appendChild(authorFragment);

            if (!sortedAuthors.includes(selectedAuthor) && selectedAuthor !== "전체") {
                authorSelect.value = "전체";
            }

            renderArticleList();
        }

        function renderArticleList() {
            const selectedType = typeSelect.value;
            const selectedCohort = cohortSelect.value;
            const selectedAuthor = authorSelect.value;

            let filtered = articlesData;
            if (selectedType && selectedType !== "전체") {
                filtered = filtered.filter(item => item.type === selectedType);
            }
            if (selectedCohort && selectedCohort !== "전체") {
                filtered = filtered.filter(item => item.cohort === selectedCohort);
            }
            if (selectedAuthor && selectedAuthor !== "전체") {
                filtered = filtered.filter(item => item.author === selectedAuthor);
            }

            articleList.innerHTML = '';
            listTitle.textContent = `검색된 글 목록 (${filtered.length}건)`;

            if (filtered.length === 0) {
                articleList.innerHTML = '<li style="padding: 10px; color: #9ca3af; text-align: center;">조건에 일치하는 글이 없습니다.</li>';
                listContainer.style.display = 'block';
                return;
            }

            const listFragment = document.createDocumentFragment();
            filtered.forEach(article => {
                const li = document.createElement('li');
                li.className = 'article-item';
                li.textContent = `[${article.title}] - ${article.author}`;
                li.title = `[${article.title}] - ${article.author} (${article.cohort}, ${article.vol})`;
                li.addEventListener('click', function() {
                    document.querySelectorAll('.article-item').forEach(el => el.classList.remove('active'));
                    li.classList.add('active');
                    showArticleDetail(article.id);
                    
                    articleViewer.classList.add('open');
                });
                listFragment.appendChild(li);
            });
            
            articleList.appendChild(listFragment);
            listContainer.style.display = 'block';
        }

        function showArticleDetail(id) {
            const article = articlesData.find(item => item.id === id);
            if (article) {
                metaInfo.style.display = 'block';
                metaInfo.innerHTML = `<strong>[${article.title}]</strong> | 발행: ${article.vol} (${article.date}) | 기수: ${article.cohort} | 기고자: ${article.author} | 종류: ${article.type} | 관리번호: ${article.id}`;
                contentBody.className = '';
                contentBody.textContent = article.content;
            }
        }

        const resetViewer = () => {
            updateFilters();
            articleViewer.classList.remove('open');
            metaInfo.style.display = 'none';
            contentBody.className = 'placeholder-text';
            contentBody.textContent = '목록에서 글을 선택하시면 전문이 표시됩니다.';
        };

        typeSelect.addEventListener('change', resetViewer);
        cohortSelect.addEventListener('change', resetViewer);
        authorSelect.addEventListener('change', () => {
            renderArticleList();
            articleViewer.classList.remove('open');
            metaInfo.style.display = 'none';
            contentBody.className = 'placeholder-text';
            contentBody.textContent = '목록에서 글을 선택하시면 전문이 표시됩니다.';
        });

        loadSheetData();
    </script>
</body>
</html>
