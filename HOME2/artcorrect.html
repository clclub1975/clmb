<!-- artcorrect.html v0.2 : 레이아웃 고도화 (인라인 제목, 취소 라벨 변경, 하단 툴바 배치, 버튼 색상 통일) -->
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>기고문 교정</title>
    <style>
        body {
            font-family: 'Segoe UI', AppleSDGothicNeo, sans-serif;
            background-color: #e2e8f0;
            margin: 0; padding: 40px 20px;
            display: flex; justify-content: center;
            color: #334155;
        }
        /* 메인 컨테이너 */
        .editor-container {
            background: #fff; border-radius: 8px; width: 100%; max-width: 900px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            display: flex; flex-direction: column; overflow: hidden;
        }
        
        /* 헤더 */
        .editor-header {
            background: #fff; display: flex; justify-content: space-between; align-items: center;
            border-bottom: 1px solid #e2e8f0; padding: 15px 20px;
        }
        .editor-title { font-size: 18px; font-weight: 700; color: #1e293b; display: flex; align-items: center; }
        .version-badge { font-size: 14px; font-weight: 500; color: #64748b; margin-left: 8px; }
        .btn-close {
            background: transparent; border: none; font-size: 15px; color: #64748b; 
            font-weight: 600; cursor: pointer; padding: 4px 8px; transition: color 0.15s;
        }
        .btn-close:hover { color: #ef4444; }

        /* 상단 컨트롤 바 */
        .editor-controls {
            display: flex; justify-content: space-between; align-items: center;
            background: #f8fafc; border-bottom: 1px solid #e2e8f0; padding: 12px 20px;
        }
        .controls-left, .controls-right { display: flex; align-items: center; gap: 10px; }
        
        /* v0.2: 액션 버튼 색상 지정 (저장/계속에도 인디고/블루 계열 색상 부여) */
        .btn-action { 
            padding: 7px 16px; font-size: 13px; font-weight: 600; border-radius: 4px; 
            cursor: pointer; border: none; transition: all 0.15s; color: #fff;
        }
        .btn-save-stay { background: #4f46e5; }
        .btn-save-stay:hover { background: #4338ca; }
        .btn-save-exit { background: #2563eb; }
        .btn-save-exit:hover { background: #1d4ed8; }
        
        /* 본문 에디터 영역 */
        .editor-body { padding: 25px; overflow-y: auto; background: #fff; min-height: 400px; }
        
        /* 개별 편집 필드 리스트 */
        .edit-ul { list-style: none; padding: 0; margin: 0; }
        .edit-li { margin-bottom: 20px; }
        .edit-label { display: block; margin-bottom: 8px; font-size: 14px; font-weight: 600; color: #334155; }
        .edit-field-wrap { display: flex; flex-direction: column; width: 100%; }
        
        .edit-textarea-inline {
            width: 100%; padding: 12px; border: 1px solid #cbd5e1; border-radius: 6px; 
            font-size: 15px; font-family: 'Segoe UI', AppleSDGothicNeo, sans-serif; 
            box-sizing: border-box; background: #fdfdfd; line-height: 1.6; resize: vertical; min-height: 300px;
        }
        .edit-textarea-inline:focus { 
            border-color: #3b82f6; outline: none; background: #fff; box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1); 
        }
        
        /* v0.2: 한 줄 배치(Inline) 항목용 스타일 (글 종류, 기수, 기고자, 제목) */
        .edit-li-inline {
            display: flex; flex-direction: column; margin-bottom: 16px;
        }
        .inline-row {
            display: flex; align-items: center; width: 100%;
        }
        .edit-li-inline .edit-label { 
            margin-bottom: 0; width: 90px; flex-shrink: 0; font-size: 14px; font-weight: 600; color: #334155;
        }
        .thin-input {
            flex: 1; padding: 4px 8px; height: 30px; font-size: 14px; 
            border: 1px solid #cbd5e1; border-radius: 4px; box-sizing: border-box; background: #fdfdfd;
        }
        .thin-input.short-input {
            max-width: 200px; /* 글 종류, 기수, 기고자는 적당한 너비 유지 */
        }
        .thin-input:focus { border-color: #3b82f6; outline: none; background: #fff; box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1); }

        /* v0.2: 요약문 교정창처럼 교정창 바로 아래 우측으로 배치된 복원 툴바 */
        .restore-toolbar { 
            display: flex; justify-content: flex-end; align-items: center; gap: 6px; margin-top: 5px; 
        }
        .btn-restore { 
            background: #ffffff; border: 1px solid #cbd5e1; color: #475569; font-size: 12px; 
            font-weight: 600; padding: 3px 8px; border-radius: 4px; cursor: pointer; transition: background 0.15s; 
        }
        .btn-restore:hover { background-color: #f1f5f9; color: #1e293b; }

        /* 하단 완료 영역 */
        .editor-footer { background: #f8fafc; padding: 20px; text-align: center; border-top: 1px solid #e2e8f0; }
        .btn-finish-large { background: #10b981; color: #fff; border: none; padding: 12px 40px; font-size: 16px; font-weight: 700; border-radius: 6px; cursor: pointer; transition: background 0.2s; box-shadow: 0 2px 4px rgba(16, 185, 129, 0.3); }
        .btn-finish-large:hover { background: #059669; }

        .loading-text { text-align: center; padding: 50px; color: #64748b; font-size: 16px; }
    </style>
</head>
<body>

    <div class="editor-container">
        <!-- 헤더 -->
        <div class="editor-header">
            <span class="editor-title">✏️ 기고문 교정 <span class="version-badge">v0.2</span></span>
            <button type="button" class="btn-close" onclick="window.close()">✕ 닫기</button>
        </div>

        <!-- 상단 컨트롤 -->
        <div class="editor-controls">
            <div class="controls-left">
                <!-- 저장/계속 버튼 색상 입힘 -->
                <button type="button" class="btn-action btn-save-stay" id="btn-save-stay" onclick="handleSaveAction('stay')">저장/계속</button>
            </div>
            <div class="controls-right">
                <button type="button" class="btn-action btn-save-exit" id="btn-save-exit" onclick="handleSaveAction('exit')">저장/종료</button>
            </div>
        </div>

        <!-- 에디터 본문 (동적 렌더링) -->
        <div class="editor-body" id="editor-body-box">
            <div class="loading-text">구글 시트에서 데이터를 불러오고 있습니다...</div>
        </div>

        <!-- 하단 교정 완료 -->
        <div class="editor-footer">
            <button type="button" class="btn-finish-large" id="btn-finish-large" onclick="handleSaveAction('finish')">✓ 교정 완료</button>
        </div>
    </div>

    <script>
        const gasWebAppUrl = '여기에_GAS_웹앱_URL을_입력하세요'; 
        const SHEET_CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTCB2tSuKXLH-2oeMVcSZ59yVgjmkTVxS4941EUpNhsVI1c3cNI2Cl73UJ1Sl533YgjOuqAUPATfyVv/pub?gid=1160907663&single=true&output=csv';

        let currentArticle = null;
        let isDirty = false;
        let isSaving = false;
        let editFieldState = {}; 

        function markAsDirty() { isDirty = true; }

        async function initEditor() {
            const urlParams = new URLSearchParams(window.location.search);
            const targetId = urlParams.get('id');

            if (!targetId) {
                document.getElementById('editor-body-box').innerHTML = '<div class="loading-text" style="color:#ef4444;">오류: 글 관리번호(ID)가 전달되지 않았습니다.</div>';
                return;
            }

            try {
                const response = await fetch(SHEET_CSV_URL);
                const csvText = await response.text();
                const articles = fastParseCSV(csvText);
                
                currentArticle = articles.find(item => item.id === targetId);
                
                if (currentArticle) {
                    renderEditorUI(currentArticle);
                } else {
                    document.getElementById('editor-body-box').innerHTML = `<div class="loading-text" style="color:#ef4444;">오류: 관리번호 [${targetId}]에 해당하는 글을 찾을 수 없습니다.</div>`;
                }
            } catch (error) {
                document.getElementById('editor-body-box').innerHTML = '<div class="loading-text" style="color:#ef4444;">데이터를 불러오는 데 실패했습니다. 네트워크를 확인해주세요.</div>';
            }
        }

        // --- 편집 UI 동적 렌더링 ---
        function renderEditorUI(article) {
            editFieldState = {};

            let html = '<ul class="edit-ul">';
            // 글 종류, 기수, 기고자 (인라인 형태, 고정 너비)
            html += renderEditFieldItem('type', '1. 글 종류', article.type, 'inline-short');
            html += renderEditFieldItem('cohort', '2. 기수', article.cohort, 'inline-short');
            html += renderEditFieldItem('author', '3. 기고자', article.author, 'inline-short');
            
            // v0.2: 제목도 한 줄(인라인 형태)로 배치하되 가로 공간을 채우도록 처리
            html += renderEditFieldItem('title', '4. 제목', article.title, 'inline-full');
            
            // 본문 (Textarea)
            html += renderEditFieldItem('content', '5. 기고문 본문', article.content, 'textarea');
            html += '</ul>';

            document.getElementById('editor-body-box').innerHTML = html;
        }

        // --- 개별 필드 HTML 생성 (복원 툴바를 입력창 아래 우측으로 배치) ---
        function renderEditFieldItem(key, label, currentVal, mode) {
            editFieldState[key] = {
                currentSaved: currentVal,
                pureOriginal: currentVal, 
                history: [currentVal]
            };

            const toolbarHtml = `
                <div class="restore-toolbar">
                    <button type="button" class="btn-restore" onclick="undoField('${key}')">↺ 취소</button>
                    <button type="button" class="btn-restore" onclick="restoreSaved('${key}')">⟲ 최근 저장 상태로</button>
                    <button type="button" class="btn-restore" onclick="restoreOriginal('${key}')">📖 원문 복원</button>
                </div>
            `;

            if (mode === 'textarea') {
                return `
                    <li class="edit-li">
                        <strong class="edit-label">${label}</strong>
                        <div class="edit-field-wrap">
                            <textarea id="edit_${key}" class="edit-textarea-inline" oninput="handleFieldInput('${key}')">${currentVal}</textarea>
                            ${toolbarHtml}
                        </div>
                    </li>
                `;
            } else {
                const isShort = mode === 'inline-short' ? 'short-input' : '';
                return `
                    <li class="edit-li-inline">
                        <div class="inline-row">
                            <strong class="edit-label">${label}</strong>
                            <input type="text" id="edit_${key}" class="thin-input ${isShort}" value="${currentVal}" oninput="handleFieldInput('${key}')">
                        </div>
                        ${toolbarHtml}
                    </li>
                `;
            }
        }

        // --- 복원 및 히스토리 스택 추적 로직 ---
        function handleFieldInput(key) {
            markAsDirty();
            const el = document.getElementById(`edit_${key}`);
            if (!el) return;
            
            if (el.tagName === 'TEXTAREA') {
                el.style.height = 'auto';
                el.style.height = (el.scrollHeight) + 'px';
            }

            if (editFieldState[key]) {
                const stack = editFieldState[key].history;
                if (stack[stack.length - 1] !== el.value) {
                    stack.push(el.value);
                    if (stack.length > 50) stack.shift(); 
                }
            }
        }

        function undoField(key) {
            const el = document.getElementById(`edit_${key}`);
            if (!el || !editFieldState[key]) return;
            const stack = editFieldState[key].history;
            if (stack.length > 1) {
                stack.pop(); 
                el.value = stack[stack.length - 1]; 
                markAsDirty();
            } else {
                alert('더 이상 되돌릴 이전 입력 내용이 없습니다.');
            }
        }

        function restoreSaved(key) {
            const el = document.getElementById(`edit_${key}`);
            if (!el || !editFieldState[key]) return;
            const targetVal = editFieldState[key].currentSaved;
            if (el.value === targetVal) return alert('이미 최근 저장된 상태와 동일합니다.');
            editFieldState[key].history.push(targetVal);
            el.value = targetVal;
            markAsDirty();
        }

        function restoreOriginal(key) {
            const el = document.getElementById(`edit_${key}`);
            if (!el || !editFieldState[key]) return;
            const origVal = editFieldState[key].pureOriginal;
            if (el.value === origVal) return alert('이미 순수 원문 내용과 동일합니다.');
            editFieldState[key].history.push(origVal);
            el.value = origVal;
            markAsDirty();
        }

        // --- 저장 액션 제어 ---
        async function handleSaveAction(actionType) {
            if (isSaving || !currentArticle) return;

            if (actionType === 'finish') {
                if(confirm(`이 작업을 '완료' 처리하시겠습니까?`)) {
                    executePostSave('완료', actionType);
                }
            } else {
                executePostSave('진행', actionType);
            }
        }

        async function executePostSave(statusText, actionType) {
            isSaving = true;
            document.body.style.cursor = 'wait';

            const payload = {
                id: currentArticle.id,
                status: statusText,
                type: document.getElementById('edit_type').value,
                cohort: document.getElementById('edit_cohort').value,
                author: document.getElementById('edit_author').value,
                title: document.getElementById('edit_title').value,
                content: document.getElementById('edit_content').value
            };

            console.log("저장될 페이로드 데이터:", payload);

            try {
                // 향후 GAS 연동 엔드포인트
                /*
                await fetch(gasWebAppUrl, {
                    method: 'POST',
                    mode: 'no-cors',
                    cache: 'no-cache',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                */

                for (let key in editFieldState) {
                    const el = document.getElementById(`edit_${key}`);
                    if (el) editFieldState[key].currentSaved = el.value;
                }
                isDirty = false;

                const alertMsg = "수정내용이 성공적으로 전송되었습니다.";

                if (actionType === 'stay') {
                    alert(alertMsg);
                } else {
                    alert(alertMsg + "\n창을 닫습니다.");
                    window.close(); 
                }
            } catch (err) {
                alert("구글 시트 저장 도중 통신 오류가 발생했습니다.");
            } finally {
                isSaving = false;
                document.body.style.cursor = 'default';
            }
        }

        window.addEventListener('beforeunload', (event) => {
            if (isDirty) {
                event.preventDefault();
                event.returnValue = '';
            }
        });

        function fastParseCSV(text) {
            const articles = [];
            let start = 0, inQuotes = false, row = [];
            if (!text.endsWith('\n')) text += '\n';

            for (let i = 0; i < text.length; i++) {
                if (text[i] === '"') inQuotes = !inQuotes;
                else if ((text[i] === ',' || text[i] === '\n') && !inQuotes) {
                    let val = text.substring(start, i);
                    if (val.endsWith('\r')) val = val.slice(0, -1);
                    if (val.startsWith('"') && val.endsWith('"') && val.length >= 2) {
                        val = val.substring(1, val.length - 1).replace(/""/g, '"');
                    }
                    row.push(val.trim());
                    if (text[i] === '\n') {
                        if (row.length >= 8 && row[0] !== '' && !row[0].includes('관리 ID')) {
                            articles.push({ id: row[0], vol: row[1], date: row[2], cohort: row[3], author: row[4], type: row[5], title: row[6], content: row[7] });
                        }
                        row = [];
                    }
                    start = i + 1;
                }
            }
            return articles;
        }

        window.onload = initEditor;
    </script>
</body>
</html>
