    .editor-controls {

    .thin-input {

      background: #fdfdfd;

      background: #059669;
    }
    .loading-text {
      text-align: center;
      padding: 40px 10px;
      color: #64748b;
      font-size: 14px;
    }

    /* 반응형 미디어 쿼리 */
    @media (max-width: 640px) {
      .editor-controls {
        flex-direction: column;
        align-items: stretch;
      }
      .controls-left, .controls-right {

      }
      .inline-row {

      }
      .edit-label {
        width: 100%;
        margin-bottom: 4px;
      }
      .thin-input {
        width: 100%;
      }
    }
