<!-- test.html v2.0: articles.html의 본문 검색창(UI 디자인) 단독 분리 테스트 및 디버깅용 -->
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>본문 검색창 디자인 테스트 [v2.0]</title>
  <style>
    /* 배경 및 기본 뼈대 (articles.html과 동일 환경 구성) */
    body {
      font-family: 'Segoe UI', AppleSDGothicNeo, sans-serif;
      max-width: 1000px;
      margin: 40px auto;
      padding: 20px;
      background-color: #f9fafb;
      color: #333;
    }
    .test-header {
      background: #e2e8f0; padding: 12px 20px; border-radius: 8px; margin-bottom: 25px;
      font-size: 14px; color: #334155; font-weight: bold; text-align: center;
    }

    /* === [MODULE-STYLE: SEARCH-BAR START] === */
    .search-container {
      display: flex; gap: 8px; align-items: center; background: #ffffff; padding: 14px 20px;
      border-radius: 8px; border: 1px solid #e5e7eb; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); margin-bottom: 25px;
    }
    .search-input {
      flex: 1; padding: 10px 12px; border: 1px solid #d1d5db; border-radius: 6px; font-size: 14px;
      outline: none; transition: border-color 0.15s; font-family: inherit;
    }
    .search-input:focus { border-color: #2563eb; box-shadow: 0 0 0 3px rgba(37,99,235,0.1); }
    
    .search-btn, .search-reset-btn {
      padding: 10px 16px; border: none; border-radius: 6px; font-size: 14px; font-weight: 600;
      cursor: pointer; transition: opacity 0.15s; font-family: inherit; white-space: nowrap;
    }
    .search-btn { background-color: #2563eb; color: #fff; }
    .search-btn:hover { opacity: 0.85; }
    .search-btn:disabled { opacity: 0.6; cursor: not-allowed; }
    
    .search-reset-btn { background-color: #e5e7eb; color: #4b5563; }
    .search-reset-btn:hover { background-color: #d1d5db; }

    @media (max-width: 768px) {
      .search-container { padding: 10px; margin-bottom: 12px; gap: 6px; }
      .search-input { font-size: 12px; padding: 8px 10px; }
      .search-btn, .search-reset-btn { font-size: 12px; padding: 8px 12px; }
    }
    /* === [MODULE-STYLE: SEARCH-BAR END] === */
  </style>
</head>
<body>

  <div class="test-header">
    🛠️ 본문 검색창 디자인 단독 테스트 모드 (test.html v2.0)
  </div>

  <!-- === [MODULE-HTML: SEARCH-BAR START] === -->
  <div class="search-container" id="searchContainer">
    <input type="text" id="searchInput" class="search-input" placeholder="본문 검색어 입력 (예: 민주주의)">
    <button type="button" id="searchBtn" class="search-btn">본문 검색</button>
    <button type="button" id="searchResetBtn" class="search-reset-btn" style="display:none;">초기화</button>
  </div>
  <!-- === [MODULE-HTML: SEARCH-BAR END] === -->

  <script>
    // 디자인 UI 동작을 확인하기 위한 가짜(Mock) 스크립트입니다.
    const searchInput = document.getElementById('searchInput');
    const searchBtn = document.getElementById('searchBtn');
    const searchResetBtn = document.getElementById('searchResetBtn');

    // 본문 검색 버튼 클릭 시 UI 변화 시뮬레이션
    searchBtn.addEventListener('click', () => {
      const keyword = searchInput.value.trim();
      if (!keyword) {
        alert('검색어를 입력하세요.');
        return;
      }
      
      // 검색 중 상태 렌더링 테스트
      searchBtn.textContent = '검색 중...';
      searchBtn.disabled = true;
      searchResetBtn.style.display = 'none';

      // 1초 뒤 검색 완료 상태 렌더링 테스트
      setTimeout(() => {
        searchBtn.textContent = '본문 검색';
        searchBtn.disabled = false;
        searchResetBtn.style.display = 'inline-block';
      }, 1000);
    });

    // 엔터키 입력 지원
    searchInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') searchBtn.click();
    });

    // 초기화 버튼 클릭 시 UI 복원 시뮬레이션
    searchResetBtn.addEventListener('click', () => {
      searchInput.value = '';
      searchResetBtn.style.display = 'none';
      searchInput.focus();
    });
  </script>
</body>
</html>
