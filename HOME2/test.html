<!-- test.html v1.3: 3번 이벤트/사실/애로사항 소분류 분리 렌더링 및 버전 표기 추가 -->
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>촛불회 회보 - test.html v1.3</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: #f8f9fa;
            color: #333;
            line-height: 1.5;
            padding: 20px;
        }
        .modal-content {
            background: #fff;
            padding: 24px;
            border-radius: 8px;
            width: 100%;
            max-width: 650px;
            margin: 0 auto;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #e2e8f0;
            padding-bottom: 12px;
            margin-bottom: 16px;
        }
        .modal-title { font-size: 1.15rem; font-weight: bold; color: #1e293b; }
        
        /* 상단 호수 선택 영역 및 버전 표기 */
        .selector-container {
            margin-bottom: 16px;
            text-align: center;
            background: #f1f5f9;
            padding: 10px;
            border-radius: 6px;
            position: relative;
        }
        .selector-container label {
            font-weight: bold;
            font-size: 0.9rem;
            color: #334155;
            margin-right: 8px;
        }
        .selector-container select {
            padding: 6px 12px;
            font-size: 0.95rem;
            border: 1px solid #cbd5e1;
            border-radius: 4px;
            background: #fff;
            color: #1e293b;
            cursor: pointer;
        }
        .version-badge {
            display: block;
            margin-top: 6px;
            font-size: 0.8rem;
            font-weight: 600;
            color: #64748b;
        }

        .modal-body { font-size: 0.92rem; color: #334155; text-align: left; max-height: 70vh; overflow-y: auto; }
        .modal-body h4 {
            margin-top: 16px;
            margin-bottom: 6px;
            color: #1e293b;
            font-size: 1rem;
            border-bottom: 1px solid #f1f5f9;
            padding-bottom: 4px;
        }
        .modal-body ul { padding-left: 20px; margin-bottom: 10px; list-style: disc; }
        .modal-body li { margin-bottom: 6px; }
        .modal-body strong { color: #0f172a; }
        .loading { text-align: center; padding: 20px; color: #666; }
    </style>
</head>
<body>

    <div class="modal-content">
        <!-- 상단 드롭다운 선택 영역 및 버전 표기 -->
        <div class="selector-container">
            <label for="issue-select">회보 호수 선택:</label>
            <select id="issue-select" onchange="renderSelectedIssue()">
                <option value="1">통권 001호</option>
                <option value="2">통권 002호</option>
                <option value="3">통권 003호</option>
                <option value="4">통권 004호</option>
                <option value="5">통권 005호</option>
                <option value="6">통권 006호</option>
                <option value="7">통권 007호</option>
                <option value="8">통권 008호</option>
                <option value="9">통권 009호</option>
                <option value="10">통권 010호</option>
            </select>
            <span class="version-badge">test.html v1.3</span>
        </div>

        <div class="modal-header">
            <span class="modal-title" id="modal-issue-title">구글 시트 데이터 로딩 중...</span>
        </div>
        
        <div class="modal-body" id="modal-issue-text">
            <div class="loading">구글 시트('교정본') 데이터를 불러오는 중입니다...</div>
        </div>
    </div>

    <script>
        const correctCsvUrl = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vT5y3knlwOACIPVnGma3PdHA57BCudCWlP41WZLx-7fY2XVN3LQfpm-SwNw31LSoORY0WIulyYa-i8G/pub?gid=1838786594&single=true&output=csv';
        let sheetDataMap = {};

        // CSV 파싱 함수
        function parseCSV(text) {
            let p = '', row = [''], ret = [row], i = 0, r = 0, s = !0;
            for (let l of text) {
                if ('"' === l) { if (s && l === p) row[r] += l; s = !s; }
                else if (',' === l && s) l = row[++r] = '';
                else if ('\n' === l && s) { if ('\r' === p) row[r] = row[r].slice(0, -1); row = ret[++i] = [l = '']; r = 0; }
                else row[r] += l;
                p = l;
            }
            return ret;
        }

        // 구글 시트 데이터를 가져와 파싱하는 함수
        async function loadGoogleSheetData() {
            try {
                const response = await fetch(correctCsvUrl);
                if (!response.ok) throw new Error("네트워크 응답에 실패했습니다.");
                const csvText = await response.text();
                const rows = parseCSV(csvText);

                for (let j = 1; j < rows.length; j++) {
                    const cols = rows[j].map(c => c.trim());
                    if (cols.length < 3) continue;

                    // 통권 호수 번호 추출
                    const matches = cols[1].match(/(\d+)/g);
                    if (!matches || matches.length === 0) continue;
                    
                    const issueNum = parseInt(matches[0], 10);
                    const paddedNum = String(issueNum).padStart(3, '0');

                    // 시트 컬럼 데이터를 8대 핵심 항목 및 개별 소분류 셀로 정확히 매핑
                    let pubDate = cols[2] || `${paddedNum}호`;
                    let summaryText = cols[3] || '';
                    let execText = cols[4] || '';
                    
                    // 3번 항목 세부 소분류 (시트 컬럼 구조에 맞게 개별 분리)
                    let eventCell = cols[5] || '';     // 이벤트
                    let historyCell = cols[6] || '';   // 역사적 사실
                    let troubleCell = cols[7] || '';   // 애로 사항
                    
                    let meetingText = cols[8] || '';
                    let volunteerText = cols[9] || '';
                    let subGroupText = cols[10] || '';
                    let peopleText = cols[11] || '';
                    let articleText = cols[12] || '';

                    let htmlBuilder = '';

                    // 1. 회보 정보
                    htmlBuilder += `<h4>1. 회보 정보</h4><ul>`;
                    htmlBuilder += `<li><strong>통권 호수:</strong> 통권 ${paddedNum}호</li>`;
                    htmlBuilder += `<li><strong>발행년월:</strong> ${pubDate}</li>`;
                    if (summaryText) htmlBuilder += `<li><strong>한 줄 요약:</strong> ${summaryText.replace(/\\n/g, '<br>')}</li>`;
                    htmlBuilder += `</ul>`;

                    // 2. 조직 및 체계 변화
                    if (execText) {
                        htmlBuilder += `<h4>2. 조직 및 체계 변화</h4><ul>`;
                        htmlBuilder += `<li><strong>임원진 및 체계:</strong> ${execText.replace(/\\n/g, '<br>')}</li>`;
                        htmlBuilder += `</ul>`;
                    }

                    // 3. 주요 이벤트 및 마일스톤 (3대 소분류 각각 분리 렌더링)
                    if (eventCell || historyCell || troubleCell) {
                        htmlBuilder += `<h4>3. 주요 이벤트 및 마일스톤</h4><ul>`;
                        if (eventCell) htmlBuilder += `<li><strong>이벤트:</strong> ${eventCell.replace(/\\n/g, '<br>')}</li>`;
                        if (historyCell) htmlBuilder += `<li><strong>역사적 사실:</strong> ${historyCell.replace(/\\n/g, '<br>')}</li>`;
                        if (troubleCell) htmlBuilder += `<li><strong>애로 사항:</strong> ${troubleCell.replace(/\\n/g, '<br>')}</li>`;
                        htmlBuilder += `</ul>`;
                    }

                    // 4. 주요 회의
                    if (meetingText) {
                        htmlBuilder += `<h4>4. 주요 회의</h4><ul>`;
                        htmlBuilder += `<li><strong>회의 및 의결:</strong> ${meetingText.replace(/\\n/g, '<br>')}</li>`;
                        htmlBuilder += `</ul>`;
                    }

                    // 5. 봉사 활동
                    if (volunteerText) {
                        htmlBuilder += `<h4>5. 봉사 활동</h4><ul>`;
                        htmlBuilder += `<li><strong>봉사 내용:</strong> ${volunteerText.replace(/\\n/g, '<br>')}</li>`;
                        htmlBuilder += `</ul>`;
                    }

                    // 6. 소집단 활동
                    if (subGroupText) {
                        htmlBuilder += `<h4>6. 소집단 활동</h4><ul>`;
                        htmlBuilder += `<li><strong>학술/문화/모임:</strong> ${subGroupText.replace(/\\n/g, '<br>')}</li>`;
                        htmlBuilder += `</ul>`;
                    }

                    // 7. 인물 소식
                    if (peopleText) {
                        htmlBuilder += `<h4>7. 인물 소식</h4><ul>`;
                        htmlBuilder += `<li><strong>동정 및 소식:</strong> ${peopleText.replace(/\\n/g, '<br>')}</li>`;
                        htmlBuilder += `</ul>`;
                    }

                    // 8. 기고문
                    if (articleText) {
                        htmlBuilder += `<h4>8. 기고문</h4><ul>`;
                        htmlBuilder += `<li><strong>기고문 요약:</strong> ${articleText.replace(/\\n/g, '<br>')}</li>`;
                        htmlBuilder += `</ul>`;
                    }

                    sheetDataMap[issueNum] = {
                        title: `${pubDate} - 통권 ${paddedNum}호 교정본 (구글 시트 v1.3)`,
                        content: htmlBuilder
                    };
                }

                renderSelectedIssue();
            } catch (e) {
                console.error("구글 시트 데이터 로드 오류:", e);
                document.getElementById('modal-issue-text').innerHTML = `<p style="color:red; text-align:center;">구글 시트 데이터를 불러오는 데 실패했습니다.</p>`;
            }
        }

        // 드롭다운 선택 시 해당 호수 데이터를 화면에 출력하는 함수
        function renderSelectedIssue() {
            const selectElem = document.getElementById('issue-select');
            const selectedNum = parseInt(selectElem.value, 10);
            
            const titleElem = document.getElementById('modal-issue-title');
            const textElem = document.getElementById('modal-issue-text');

            if (sheetDataMap[selectedNum]) {
                titleElem.textContent = sheetDataMap[selectedNum].title;
                textElem.innerHTML = sheetDataMap[selectedNum].content;
            } else {
                titleElem.textContent = `통권 ${String(selectedNum).padStart(3, '0')}호 교정 데이터 없음`;
                textElem.innerHTML = `<p style="text-align:center; color:#64748b; padding:20px;">해당 호수에 대한 구글 시트 교정 데이터가 아직 등록되지 않았습니다.</p>`;
            }
        }

        // 페이지 최초 실행 시 구글 시트 연동 시작
        window.onload = function() {
            loadGoogleSheetData();
        };
    </script>
</body>
</html>
