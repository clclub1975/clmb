<!-- v5.1: PC 환경 세로 스크롤 테이블 및 모바일 터치 스크롤 테이블 인터랙션 적용 -->
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>촛불회 회보 제미나이 요약 교정 작업 안내</title>
<style>
    body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        line-height: 1.6;
        max-width: 1100px;
        margin: 0 auto;
        padding: 20px 20px 40px 20px;
        color: #2b3137;
        background-color: #ffffff;
        word-break: keep-all;
    }
    .back-btn {
        display: inline-block;
        padding: 6px 14px;
        background-color: #f6f8fa;
        color: #24292e;
        text-decoration: none;
        border-radius: 6px;
        font-size: 13.5px;
        font-weight: 600;
        border: 1px solid #d1d5db;
        margin-bottom: 12px;
        transition: background-color 0.15s;
    }
    .back-btn:hover {
        background-color: #e1e4e8;
    }
    .header-container {
        text-align: center;
        margin-bottom: 25px;
    }
    h1 {
        font-size: 26px;
        margin-bottom: 8px;
        color: #1a1a1a;
    }
    .intro-box {
        background: #f6f8fa;
        border: 1px solid #e1e4e8;
        border-radius: 8px;
        padding: 20px 24px;
        margin-bottom: 25px;
        color: #586069;
        font-size: 14.5px;
    }
    .intro-box h4 {
        margin: 0 0 12px 0;
        color: #24292e;
        font-size: 16px;
    }
    .intro-box ol {
        margin: 0;
        padding-left: 20px;
    }
    .intro-box li {
        margin-bottom: 8px;
    }
    .intro-box li:last-child {
        margin-bottom: 0;
    }

    /* 소제목 스타일 */
    h3 {
        font-size: 18px;
        color: #24292e;
        margin-bottom: 12px;
    }

    /* 빠른 구간 이동 버튼 그룹 */
    .jump-bar-container {
        max-width: 75%;
        margin-left: auto;
        margin-right: auto;
        margin-bottom: 15px;
        display: flex;
        gap: 3px;
        flex-wrap: nowrap;
        overflow-x: auto;
        -webkit-overflow-scrolling: touch;
        padding-bottom: 4px;
    }
    .jump-bar-container::-webkit-scrollbar {
        height: 4px;
    }
    .jump-bar-container::-webkit-scrollbar-thumb {
        background-color: #d1d5db;
        border-radius: 2px;
    }

    .jump-btn {
        padding: 5px 10px;
        background-color: #f6f8fa;
        border: 1px solid #d1d5db;
        border-radius: 4px;
        color: #0366d6;
        font-size: 12.5px;
        font-weight: 500;
        text-decoration: none;
        cursor: pointer;
        white-space: nowrap;
        flex-shrink: 0;
        transition: background-color 0.15s, color 0.15s, border-color 0.15s;
    }
    .jump-btn:hover, .jump-btn.active {
        background-color: #0366d6;
        color: #ffffff;
        border-color: #0366d6;
    }
    
    /* PC 환경: 테이블 영역에 세로 스크롤 및 카드 단위 스냅핑(Snap) 적용 */
    .archive-scroll-wrapper {
        max-width: 75%;
        margin-left: auto;
        margin-right: auto;
        max-height: 520px; /* PC 화면에서 3~4행 정도만 보이고 세로 스크롤되도록 지정 */
        overflow-y: auto;
        scroll-snap-type: y mandatory;
        border-bottom: 2px solid #4a5568;
        margin-bottom: 40px;
    }
    .archive-scroll-wrapper::-webkit-scrollbar {
        width: 6px;
    }
    .archive-scroll-wrapper::-webkit-scrollbar-thumb {
        background-color: #cbd5e1;
        border-radius: 3px;
    }

    /* CSS Grid 기반 5열 배치 레이아웃 */
    .archive-grid {
        display: grid;
        grid-template-columns: repeat(5, 1fr);
        gap: 0;
        border-top: 2px solid #4a5568;
        border-left: 2px solid #4a5568;
    }
    
    /* 단위 셀 외곽선 및 스냅 정렬 */
    .issue-unit {
        border-right: 2px solid #4a5568;
        border-bottom: 2px solid #4a5568;
        background-color: #ffffff;
        display: flex;
        flex-direction: column;
        scroll-snap-align: start; /* 세로 스크롤 시 카드 단위로 탁탁 끊겨서 정렬됨 */
    }
    
    /* 단위 셀 헤더 */
    .issue-header {
        background-color: #f6f8fa;
        color: #1a1a1a;
        font-weight: 600;
        text-align: center;
        padding: 7px 5px;
        border-bottom: 1px solid #d1d5db;
        font-size: 14px;
    }
    
    /* 비활성 단위 셀 헤더 스타일 */
    .issue-unit.inactive .issue-header {
        color: #959da5;
        background-color: #fafbfc;
    }
    
    /* 단위 셀 서브 셀 컨테이너 (3열 구조) */
    .issue-body {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        background-color: #ffffff;
        flex-grow: 1;
    }
    
    /* 내부 서브 셀 낱개 */
    .sub-cell {
        text-align: center;
        padding: 7px 5px;
        font-size: 14px;
    }
    .sub-cell:not(:last-child) {
        border-right: 1px solid #d1d5db;
    }
    
    /* 하이퍼링크 및 텍스트 스타일 */
    .sub-cell a {
        text-decoration: underline;
        color: #0366d6;
        font-weight: 500;
    }
    .sub-cell a:hover {
        opacity: 0.8;
    }
    .plain-text {
        color: #2b3137;
    }
    .empty-cell {
        color: #959da5;
    }

    /* 반응형 디자인 (미디어 쿼리 적용) */
    @media (max-width: 1024px) {
        .archive-scroll-wrapper, .jump-bar-container {
            max-width: 90%;
        }
        .archive-grid {
            grid-template-columns: repeat(4, 1fr);
        }
    }

    @media (max-width: 768px) {
        body {
            padding: 12px;
        }
        .archive-scroll-wrapper, .jump-bar-container {
            max-width: 100%;
        }
        /* 스마트폰 환경: 세로 제한(max-height)을 풀고 테이블 자체를 자연스럽게 터치 스크롤하도록 허용 */
        .archive-scroll-wrapper {
            max-height: none;
            overflow-y: visible;
            scroll-snap-type: none;
            border-bottom: none;
        }
        .archive-grid {
            grid-template-columns: repeat(3, 1fr);
        }
        h1 {
            font-size: 22px;
        }
        .issue-header {
            font-size: 12px;
            padding: 5px 2px;
        }
        .sub-cell {
            font-size: 12px;
            padding: 5px 2px;
        }
        .jump-bar-container {
            gap: 2px;
            justify-content: space-between;
        }
        .jump-btn {
            padding: 4px 5px;
            font-size: 11px;
            flex-grow: 1;
            text-align: center;
        }
    }
</style>
</head>
<body>
    <a href="../index.html" class="back-btn">← 메인으로 돌아가기</a>
    <div class="header-container">
        <h1>🕯️ 촛불회 회보 제미나이 요약 교정 작업 안내 <span style="font-size: 0.5em; color: #666; font-weight: normal;">v5.1</span></h1>
    </div>

    <div class="intro-box">
        <h4>📌 본 페이지의 활용에 대한 설명</h4>
        <ol>
            <li>본 페이지는 제미나이가 촛불회 회보를 엉터리로 요약한 부분을 교정하기 위해 마련되었습니다.</li>
            <li>아울러 촛불회 회보의 원본(PDF)과 요약(슬라이드)을 보는데 활용될 수도 있습니다.</li>
            <li>현재는 샘플 회보 30권(001~030호)이 게시되어 있으며, 향후 190권 전권을 모두 게시할 예정입니다.</li>
        </ol>
    </div>

    <!-- 소제목 -->
    <h3 id="section-title">📋 회보 요약 및 교정 현황 (01~30)</h3>

    <!-- 빠른 구간 이동 버튼 바 -->
    <div class="jump-bar-container">
        <button class="jump-btn active" onclick="switchSection(1, 30, '01~30', this)">01~30</button>
        <button class="jump-btn" onclick="switchSection(31, 60, '31~60', this)">31~60</button>
        <button class="jump-btn" onclick="switchSection(61, 90, '61~90', this)">61~90</button>
        <button class="jump-btn" onclick="switchSection(91, 120, '91~120', this)">91~120</button>
        <button class="jump-btn" onclick="switchSection(121, 150, '121~150', this)">121~150</button>
        <button class="jump-btn" onclick="switchSection(151, 180, '151~180', this)">151~180</button>
        <button class="jump-btn" onclick="switchSection(181, 190, '181~190', this)">181~190</button>
    </div>

    <!-- PC 세로 스크롤 및 모바일 터치 스크롤을 감싸는 래퍼 -->
    <div class="archive-scroll-wrapper">
        <!-- 5행 6열 (총 30개 호수) 동적 그리드 테이블 -->
        <div class="archive-grid" id="archive-grid">
            <!-- 자바스크립트에 의해 동적으로 30개의 카드가 렌더링됩니다 -->
        </div>
    </div>

    <script>
        // 샘플 데이터 (001~003호 실제 링크 데이터, 나머지는 미게시 상태)
        const sampleData = {
            1: { title: "1984년 3월호", pdf: "https://drive.google.com/file/d/1Qub8xr3JITKMdBc2tCZyMdUPBFNYfI3A/view?usp=sharing", summary: "https://docs.google.com/presentation/d/1HI9G7vevnFgdjJ57igO30tMYy6bVnwH6/edit?usp=drive_link&ouid=108392210159868939168&rtpof=true&sd=true#slide=id.p1" },
            2: { title: "1984년 4월호", pdf: "https://drive.google.com/file/d/1pBsf8c2pIGYLqshh63RtWPSPUEffJj7d/view?usp=sharing", summary: "https://docs.google.com/presentation/d/1HI9G7vevnFgdjJ57igO30tMYy6bVnwH6/edit?usp=drive_link&ouid=108392210159868939168&rtpof=true&sd=true#slide=id.p2" },
            3: { title: "1984년 5월호", pdf: "https://drive.google.com/file/d/1JWlSGSxXdhbmM-k7E2ruXqCbP_kLBbVk/view?usp=sharing", summary: "https://docs.google.com/presentation/d/1HI9G7vevnFgdjJ57igO30tMYy6bVnwH6/edit?usp=drive_link&ouid=108392210159868939168&rtpof=true&sd=true#slide=id.p3" }
        };

        function switchSection(startNum, endNum, rangeStr, btnElement) {
            // 버튼 활성 상태 스타일 변경
            document.querySelectorAll('.jump-btn').forEach(btn => btn.classList.remove('active'));
            btnElement.classList.add('active');

            // 소제목 업데이트
            document.getElementById('section-title').innerText = `📋 회보 요약 및 교정 현황 (${rangeStr})`;

            const gridContainer = document.getElementById('archive-grid');
            gridContainer.innerHTML = '';

            // 항상 30개 슬롯(5행 6열)을 생성하여 레이아웃 고정 유지
            for (let i = 0; i < 30; i++) {
                const issueNum = startNum + i;
                const unitDiv = document.createElement('div');

                if (issueNum <= endNum) {
                    const issueInfo = sampleData[issueNum];
                    if (issueInfo) {
                        // 데이터가 존재하는 활성 호수
                        unitDiv.className = 'issue-unit';
                        unitDiv.innerHTML = `
                            <div class="issue-header">[${String(issueNum).padStart(3, '0')}호]&nbsp;&nbsp;${issueInfo.title}</div>
                            <div class="issue-body">
                                <div class="sub-cell"><a href="${issueInfo.pdf}" target="_blank">회보</a></div>
                                <div class="sub-cell"><a href="${issueInfo.summary}" target="_blank">요약</a></div>
                                <div class="sub-cell"><span class="plain-text">교정</span></div>
                            </div>
                        `;
                    } else {
                        // 번호는 해당되지만 아직 데이터가 없는 호수
                        unitDiv.className = 'issue-unit inactive';
                        unitDiv.innerHTML = `
                            <div class="issue-header">[${String(issueNum).padStart(3, '0')}호]</div>
                            <div class="issue-body">
                                <div class="sub-cell"><span class="empty-cell">-</span></div>
                                <div class="sub-cell"><span class="empty-cell">-</span></div>
                                <div class="sub-cell"><span class="empty-cell">-</span></div>
                            </div>
                        `;
                    }
                } else {
                    // 181~190호처럼 30개 칸을 채우고 남는 빈 자리 처리
                    unitDiv.className = 'issue-unit inactive';
                    unitDiv.innerHTML = `
                        <div class="issue-header">-</div>
                        <div class="issue-body">
                            <div class="sub-cell"><span class="empty-cell">-</span></div>
                            <div class="sub-cell"><span class="empty-cell">-</span></div>
                            <div class="sub-cell"><span class="empty-cell">-</span></div>
                        </div>
                    `;
                }
                gridContainer.appendChild(unitDiv);
            }
        }

        // 페이지 최초 진입 시 01~30호 기본 로드
        window.onload = function() {
            switchSection(1, 30, '01~30', document.querySelector('.jump-btn'));
        };
    </script>
</body>
</html>
