        .modal-body {
            padding: 20px;
            overflow-y: auto;
            flex-grow: 1;
            font-size: 0.9rem;
            line-height: 1.6;

        .modal-actions {

            background: #f8f9fa;
            border-top: 1px solid #e2e8f0;
            display: flex;
            justify-content: flex-end;
            gap: 8px;
        }
        .btn-pdf {

            th, td { font-size: 0.65rem; padding: 4px 1px; }
