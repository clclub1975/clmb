<!-- v5.9: 스크롤바와 상하 화살표 버튼의 수평 중심축 완벽 일치 정렬 및 테이블 하단 테두리 굵기 정규화 적용 -->
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>촛불회 회보 제미나이 요약 교정 작업 안내</title>
<style>
    body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        line-height: 1.6;
        max-width: 1100px;
        margin: 0 auto;
        padding: 20px 20px 40px 20px;
        color: #2b3137;
        background-color: #ffffff;
        word-break: keep-all;
    }
    .back-btn {
        display: inline-block;
        padding: 6px 14px;
        background-color: #f6f8fa;
        color: #24292e;
        text-decoration: none;
        border-radius: 6px;
        font-size: 13.5px;
        font-weight: 600;
        border: 1px solid #d1d5db;
        margin-bottom: 12px;
        transition: background-color 0.15s;
    }
    .back-btn:hover {
        background-color: #e1e4e8;
    }
    .header-container {
        text-align: center;
        margin-bottom: 25px;
    }
    h1 {
        font-size: 26px;
        margin-bottom: 8px;
        color: #1a1a1a;
    }
    .intro-box {
        background: #f6f8fa;
        border: 1px solid #e1e4e8;
        border-radius: 8px;
        padding: 20px 24px;
        margin-bottom: 25px;
        color: #586069;
        font-size: 14.5px;
    }
    .intro-box h4 {
        margin: 0 0 12px 0;
        color: #24292e;
        font-size: 16px;
    }
    .intro-box ol {
        margin: 0;
        padding-left: 20px;
    }
    .intro-box li {
        margin-bottom: 8px;
    }
    .intro-box li:last-child {
        margin-bottom: 0;
    }

    /* 소제목 스타일 */
    h3 {
        font-size: 18px;
        color: #24292e;
        margin-bottom: 12px;
    }

    /* 빠른 구간 이동 버튼 그룹 */
    .jump-bar-container {
        max-width: 75%;
        margin-left: auto;
        margin-right: auto;
        margin-bottom: 15px;
        display: flex;
        gap: 3px;
        flex-wrap: nowrap;
        overflow-x: auto;
        -webkit-overflow-scrolling: touch;
        padding-bottom: 4px;
    }
    .jump-bar-container::-webkit-scrollbar {
        height: 4px;
    }
    .jump-bar-container::-webkit-scrollbar-thumb {
        background-color: #d1d5db;
        border-radius: 2px;
    }

    .jump-btn {
        padding: 5px 10px;
        background-color: #f6f8fa;
        border: 1px solid #d1d5db;
        border-radius: 4px;
        color: #0366d6;
        font-size: 12.5px;
        font-weight: 500;
        text-decoration: none;
        cursor: pointer;
        white-space: nowrap;
        flex-shrink: 0;
        transition: background-color 0.15s, color 0.15s, border-color 0.15s;
    }
    .jump-btn:hover, .jump-btn.active {
        background-color: #0366d6;
        color: #ffffff;
        border-color: #0366d6;
    }
    
    /* PC 전용 세로 스크롤 컨테이너 및 화살표 배치를 위한 외곽 래퍼 */
    .table-outer-container {
        max-width: 75%;
        margin-left: auto;
        margin-right: auto;
        position: relative;
        margin-bottom: 40px;
    }

    /* 스크롤 래퍼 (5열 7행 정확히 노출되도록 높이 설정 및 스냅 적용) */
    .archive-scroll-wrapper {
        width: 100%;
        max-height: 525px; /* 5열 7행 크기에 딱 맞춘 높이 (셀 하나 높이 약 75px * 7행) */
        overflow-y: scroll;
        scroll-snap-type: y mandatory;
        border: 2px solid #4a5568;
        border-radius: 0;
        background-color: #ffffff;
    }
    
    /* 스크롤바 스타일 (너비 16px로 지정) */
    .archive-scroll-wrapper::-webkit-scrollbar {
        width: 16px;
    }
    .archive-scroll-wrapper::-webkit-scrollbar-track {
        background: #f1f5f9;
        border-left: 1px solid #cbd5e1;
    }
    .archive-scroll-wrapper::-webkit-scrollbar-thumb {
        background-color: #94a3b8;
        border-radius: 0;
    }
    .archive-scroll-wrapper::-webkit-scrollbar-thumb:hover {
        background-color: #64748b;
    }

    /* 상하 스크롤 제어 화살표 버튼 스타일 (스크롤바 트랙(16px) 내부에 정확히 센터링) */
    .scroll-arrow-btn {
        position: absolute;
        right: 0; /* 래퍼의 오른쪽 끝 기준 */
        width: 16px; /* 스크롤바 너비와 동일하게 설정 */
        height: 16px;
        background-color: #e2e8f0;
        border: 1px solid #cbd5e1;
        color: #475569;
        font-size: 8.5px;
        font-weight: bold;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        z-index: 10;
        transition: background-color 0.15s, color 0.15s;
    }
    .scroll-arrow-btn:hover {
        background-color: #0366d6;
        color: #ffffff;
        border-color: #0366d6;
    }
    .scroll-up-btn {
        top: 2px; /* 래퍼 상단 테두리 안쪽 정렬 */
    }
    .scroll-down-btn {
        bottom: 2px; /* 래퍼 하단 테두리 안쪽 정렬 */
    }

    /* CSS Grid 기반 5열 배치 레이아웃 */
    .archive-grid {
        display: grid;
        grid-template-columns: repeat(5, 1fr);
        gap: 0;
        border-top: none;
        border-left: none;
    }
    
    /* 단위 셀 외곽선 및 스냅 정렬 (카드 단위로 정확히 걸림) */
    .issue-unit {
        border-right: 2px solid #4a5568;
        border-bottom: 2px solid #4a5568; /* 기본 셀 하단 선 두께 */
        background-color: #ffffff;
        display: flex;
        flex-direction: column;
        scroll-snap-align: start;
        height: 75px; /* 셀 높이 고정으로 스냅 정확도 극대화 */
        box-sizing: border-box;
    }

    /* 마지막 행의 셀들은 하단 테두리를 일반 선 두께(2px)와 동일하게 정규화 */
    .issue-unit.last-row {
        border-bottom: 2px solid #4a5568 !important;
    }
    
    /* 단위 셀 헤더 */
    .issue-header {
        background-color: #f6f8fa;
        color: #1a1a1a;
        font-weight: 600;
        text-align: center;
        padding: 5px 5px;
        border-bottom: 1px solid #d1d5db;
        font-size: 13.5px;
    }
    
    /* 비활성 단위 셀 헤더 스타일 */
    .issue-unit.inactive .issue-header {
        color: #959da5;
        background-color: #fafbfc;
    }
    
    /* 단위 셀 서브 셀 컨테이너 (3열 구조) */
    .issue-body {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        background-color: #ffffff;
        flex-grow: 1;
    }
    
    /* 내부 서브 셀 낱개 */
    .sub-cell {
        text-align: center;
        padding: 5px 5px;
        font-size: 13.5px;
        display: flex;
        align-items: center;
        justify-content: center;
    }
    .sub-cell:not(:last-child) {
        border-right: 1px solid #d1d5db;
    }
    
    /* 하이퍼링크 및 텍스트 스타일 */
    .sub-cell a {
        text-decoration: underline;
        color: #0366d6;
        font-weight: 500;
    }
    .sub-cell a:hover {
        opacity: 0.8;
    }
    .plain-text {
        color: #2b3137;
    }
    .empty-cell {
        color: #959da5;
    }

    /* 반응형 디자인 (미디어 쿼리 적용) */
    @media (max-width: 1024px) {
        .table-outer-container, .jump-bar-container {
            max-width: 90%;
        }
        .archive-grid {
            grid-template-columns: repeat(4, 1fr);
        }
        .scroll-arrow-btn {
            display: none; /* 태블릿/모바일에서는 화살표 숨김 */
        }
    }

    @media (max-width: 768px) {
        body {
            padding: 12px;
        }
        .table-outer-container, .jump-bar-container {
            max-width: 100%;
        }
        /* 모바일 환경: 세로 스크롤 제한 해제 및 기본 스타일 복원 */
        .archive-scroll-wrapper {
            max-height: none;
            overflow-y: visible;
            scroll-snap-type: none;
            border: none;
            background-color: transparent;
        }
        .archive-grid {
            border-top: 2px solid #4a5568;
            border-left: 2px solid #4a5568;
            grid-template-columns: repeat(3, 1fr);
        }
        .issue-unit {
            height: auto;
        }
        h1 {
            font-size: 22px;
        }
        .issue-header {
            font-size: 12px;
            padding: 5px 2px;
        }
        .sub-cell {
            font-size: 12px;
            padding: 5px 2px;
        }
        .jump-bar-container {
            gap: 2px;
            justify-content: space-between;
        }
        .jump-btn {
            padding: 4px 5px;
            font-size: 11px;
            flex-grow: 1;
            text-align: center;
        }
        .scroll-arrow-btn {
            display: none;
        }
    }
</style>
</head>
<body>
    <a href="../index.html" class="back-btn">← 메인으로 돌아가기</a>
    <div class="header-container">
        <h1>🕯️ 촛불회 회보 제미나이 요약 교정 작업 안내 <span style="font-size: 0.5em; color: #666; font-weight: normal;">v5.9</span></h1>
    </div>

    <div class="intro-box">
        <h4>📌 본 페이지의 활용에 대한 설명</h4>
        <ol>
            <li>본 페이지는 제미나이가 촛불회 회보를 엉터리로 요약한 부분을 교정하기 위해 마련되었습니다.</li>
            <li>아울러 촛불회 회보의 원본(PDF)과 요약(슬라이드)을 보는데 활용될 수도 있습니다.</li>
            <li>현재는 샘플 회보 30권(001~030호)이 게시되어 있으며, 향후 190권 전권을 모두 게시할 예정입니다.</li>
        </ol>
    </div>

    <!-- 소제목 -->
    <h3 id="section-title">📋 회보 요약 및 교정 현황 (전체 001~190호)</h3>

    <!-- 빠른 구간 이동 버튼 바 -->
    <div class="jump-bar-container">
        <button class="jump-btn active" onclick="scrollToSection(1, this)">01~30</button>
        <button class="jump-btn" onclick="scrollToSection(31, this)">31~60</button>
        <button class="jump-btn" onclick="scrollToSection(61, this)">61~90</button>
        <button class="jump-btn" onclick="scrollToSection(91, this)">91~120</button>
        <button class="jump-btn" onclick="scrollToSection(121, this)">121~150</button>
        <button class="jump-btn" onclick="scrollToSection(151, this)">151~180</button>
        <button class="jump-btn" onclick="scrollToSection(181, this)">181~190</button>
    </div>

    <!-- PC 세로 스크롤 래퍼 및 스크롤바와 중심축이 완벽 일치하는 상하 화살표 컨테이너 -->
    <div class="table-outer-container">
        <!-- 상단 화살표 버튼 (중심축 완벽 일치) -->
        <button class="scroll-arrow-btn scroll-up-btn" onclick="scrollLine(-1)" title="위로 한 줄 이동">▲</button>
        
        <div class="archive-scroll-wrapper" id="scroll-wrapper">
            <!-- 5열 그리드 테이블 (5열 7행 구조 렌더링) -->
            <div class="archive-grid" id="archive-grid">
                <!-- 자바스크립트에 의해 1~190호 전체 카드가 동적 생성됩니다 -->
            </div>
        </div>

        <!-- 하단 화살표 버튼 (중심축 완벽 일치) -->
        <button class="scroll-arrow-btn scroll-down-btn" onclick="scrollLine(1)" title="아래로 한 줄 이동">▼</button>
    </div>

    <script>
        // 샘플 데이터 (001~003호 실제 링크 데이터)
        const sampleData = {
            1: { title: "1984년 3월호", pdf: "https://drive.google.com/file/d/1Qub8xr3JITKMdBc2tCZyMdUPBFNYfI3A/view?usp=sharing", summary: "https://docs.google.com/presentation/d/1HI9G7vevnFgdjJ57igO30tMYy6bVnwH6/edit?usp=drive_link&ouid=108392210159868939168&rtpof=true&sd=true#slide=id.p1" },
            2: { title: "1984년 4월호", pdf: "https://drive.google.com/file/d/1pBsf8c2pIGYLqshh63RtWPSPUEffJj7d/view?usp=sharing", summary: "https://docs.google.com/presentation/d/1HI9G7vevnFgdjJ57igO30tMYy6bVnwH6/edit?usp=drive_link&ouid=108392210159868939168&rtpof=true&sd=true#slide=id.p2" },
            3: { title: "1984년 5월호", pdf: "https://drive.google.com/file/d/1JWlSGSxXdhbmM-k7E2ruXqCbP_kLBbVk/view?usp=sharing", summary: "https://docs.google.com/presentation/d/1HI9G7vevnFgdjJ57igO30tMYy6bVnwH6/edit?usp=drive_link&ouid=108392210159868939168&rtpof=true&sd=true#slide=id.p3" }
        };

        // 1부터 190호까지 전체 카드를 생성하여 렌더링
        function renderAllIssues() {
            const gridContainer = document.getElementById('archive-grid');
            gridContainer.innerHTML = '';

            for (let i = 1; i <= 190; i++) {
                const unitDiv = document.createElement('div');
                unitDiv.id = `issue-${i}`;
                
                // 마지막 행(186~190호)에 해당하는 경우 마지막 줄 테두리 정규화 클래스 추가
                let className = 'issue-unit';
                if (i > 185) {
                    className += ' last-row';
                }

                const issueInfo = sampleData[i];

                if (issueInfo) {
                    unitDiv.className = className;
                    unitDiv.innerHTML = `
                        <div class="issue-header">[${String(i).padStart(3, '0')}호]&nbsp;&nbsp;${issueInfo.title}</div>
                        <div class="issue-body">
                            <div class="sub-cell"><a href="${issueInfo.pdf}" target="_blank">회보</a></div>
                            <div class="sub-cell"><a href="${issueInfo.summary}" target="_blank">요약</a></div>
                            <div class="sub-cell"><span class="plain-text">교정</span></div>
                        </div>
                    `;
                } else {
                    unitDiv.className = className + ' inactive';
                    unitDiv.innerHTML = `
                        <div class="issue-header">[${String(i).padStart(3, '0')}호]</div>
                        <div class="issue-body">
                            <div class="sub-cell"><span class="empty-cell">-</span></div>
                            <div class="sub-cell"><span class="empty-cell">-</span></div>
                            <div class="sub-cell"><span class="empty-cell">-</span></div>
                        </div>
                    `;
                }
                gridContainer.appendChild(unitDiv);
            }
        }

        // 빠른 이동 버튼 클릭 시 해당 번호의 카드로 부드럽게 스크롤 이동
        function scrollToSection(startNum, btnElement) {
            document.querySelectorAll('.jump-btn').forEach(btn => btn.classList.remove('active'));
            btnElement.classList.add('active');

            const targetElement = document.getElementById(`issue-${startNum}`);
            const wrapper = document.getElementById('scroll-wrapper');

            if (targetElement && wrapper) {
                const topPos = targetElement.offsetTop - wrapper.offsetTop;
                wrapper.scrollTo({
                    top: topPos,
                    behavior: 'smooth'
                });
            }

            // 소제목 업데이트
            const endNum = Math.min(startNum + 29, 190);
            document.getElementById('section-title').innerText = `📋 회보 요약 및 교정 현황 (${String(startNum).padStart(2, '0')}~${String(endNum).padStart(2, '0')})`;
        }

        // 상하 화살표 클릭 시 한 행(5개 셀 단위)씩 부드럽게 스크롤 제어
        function scrollLine(direction) {
            const wrapper = document.getElementById('scroll-wrapper');
            if (wrapper) {
                // 5열 기준 한 행의 높이(약 75px)만큼 위 또는 아래로 이동
                const rowHeight = 75;
                wrapper.scrollBy({
                    top: direction * rowHeight,
                    behavior: 'smooth'
                });
            }
        }

        // 페이지 최초 진입 시 전체 190권 렌더링
        window.onload = function() {
            renderAllIssues();
        };
    </script>
</body>
</html>
