    <script>
        const pdfCsvUrl = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vREEH1WnaWylHjZPq8IegURPhYSYDGIPKHhtE31taVWSit7Ho2hRSpU2m95hULcnCl3pk0DWytPL7Xx/pub?gid=0&single=true&output=csv';
        const correctCsvUrl = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vT5y3knlwOACIPVnGma3PdHA57BCudCWlP41WZLx-7fY2XVN3LQfpm-SwNw31LSoORY0WIulyYa-i8G/pub?gid=1838786594&single=true&output=csv';
        const originalCsvUrl = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vT5y3knlwOACIPVnGma3PdHA57BCudCWlP41WZLx-7fY2XVN3LQfpm-SwNw31LSoORY0WIulyYa-i8G/pub?gid=239571560&single=true&output=csv';
        
        let correctMap = {};    // 교정본 데이터
        let originalMap = {};   // 원본 데이터
        let globalPdfMap = {};  // PDF 링크 정보

        function parseCSV(text) {
            let p = '', row = [''], ret = [row], i = 0, r = 0, s = !0;
            for (let l of text) {
                if ('"' === l) { if (s && l === p) row[r] += l; s = !s; }
                else if (',' === l && s) l = row[++r] = '';
                else if ('\n' === l && s) { if ('\r' === p) row[r] = row[r].slice(0, -1); row = ret[++i] = [l = '']; r = 0; }
                else row[r] += l;
                p = l;
            }
            return ret;
        }

        // 시트 데이터 구조화 공통 함수 (ID 앵커 태그 부여로 목차 연동)
        function buildStructuredHtml(cols) {
            let pubDate        = cols[3] || '';
            let summaryText    = cols[4] || '';  
            let execCell       = cols[5] || '';  
            let sysCell        = cols[6] || '';  
            let eventCell      = cols[7] || '';  
            let historyCell    = cols[8] || '';  
            let troubleCell    = cols[9] || '';  
            let meetingType    = cols[10] || '';  
            let meetingVote    = cols[11] || ''; 
            let volRegular     = cols[12] || ''; 
            let volEtc         = cols[13] || ''; 
            let subStudy       = cols[14] || ''; 
            let subEtc         = cols[15] || ''; 
            let peopleInter    = cols[16] || ''; 
            let peopleNews     = cols[17] || ''; 
            let peopleEvent    = cols[18] || ''; 
            let articleSummary = cols[19] || ''; 

            let htmlBuilder = '';
            htmlBuilder += `<div id="sec1"><h4>1. 회보 정보</h4><ul>`;
            htmlBuilder += `<li><strong>발행년월:</strong> ${pubDate}</li>`;
            if (summaryText) htmlBuilder += `<li><strong>한 줄 요약:</strong> ${summaryText.replace(/\\n/g, '<br>')}</li>`;
            htmlBuilder += `</ul></div>`;

            if (execCell || sysCell) {
                htmlBuilder += `<div id="sec2"><h4>2. 조직 및 체계 변화</h4><ul>`;
                if (execCell) htmlBuilder += `<li><strong>임원진:</strong> ${execCell.replace(/\\n/g, '<br>')}</li>`;
                if (sysCell) htmlBuilder += `<li><strong>체계 변화:</strong> ${sysCell.replace(/\\n/g, '<br>')}</li>`;
                htmlBuilder += `</ul></div>`;
            } else {
                htmlBuilder += `<div id="sec2"></div>`;
            }

            if (eventCell || historyCell || troubleCell) {
                htmlBuilder += `<div id="sec3"><h4>3. 주요 이벤트 및 마일스톤</h4><ul>`;
                if (eventCell) htmlBuilder += `<li><strong>이벤트:</strong> ${eventCell.replace(/\\n/g, '<br>')}</li>`;
                if (historyCell) htmlBuilder += `<li><strong>역사적 사실:</strong> ${historyCell.replace(/\\n/g, '<br>')}</li>`;
                if (troubleCell) htmlBuilder += `<li><strong>애로 사항:</strong> ${troubleCell.replace(/\\n/g, '<br>')}</li>`;
                htmlBuilder += `</ul></div>`;
            } else {
                htmlBuilder += `<div id="sec3"></div>`;
            }

            if (meetingType || meetingVote) {
                htmlBuilder += `<div id="sec4"><h4>4. 주요 회의</h4><ul>`;
                if (meetingType) htmlBuilder += `<li><strong>회의 종류:</strong> ${meetingType.replace(/\\n/g, '<br>')}</li>`;
                if (meetingVote) htmlBuilder += `<li><strong>의결 사항:</strong> ${meetingVote.replace(/\\n/g, '<br>')}</li>`;
                htmlBuilder += `</ul></div>`;
            } else {
                htmlBuilder += `<div id="sec4"></div>`;
            }

            if (volRegular || volEtc) {
                htmlBuilder += `<div id="sec5"><h4>5. 봉사 활동</h4><ul>`;
                if (volRegular) htmlBuilder += `<li><strong>정기 봉사:</strong> ${volRegular.replace(/\\n/g, '<br>')}</li>`;
                if (volEtc) htmlBuilder += `<li><strong>기타 봉사:</strong> ${volEtc.replace(/\\n/g, '<br>')}</li>`;
                htmlBuilder += `</ul></div>`;
            } else {
                htmlBuilder += `<div id="sec5"></div>`;
            }

            if (subStudy || subEtc) {
                htmlBuilder += `<div id="sec6"><h4>6. 소집단 활동</h4><ul>`;
                if (subStudy) htmlBuilder += `<li><strong>학술/문화:</strong> ${subStudy.replace(/\\n/g, '<br>')}</li>`;
                if (subEtc) htmlBuilder += `<li><strong>기타 활동:</strong> ${subEtc.replace(/\\n/g, '<br>')}</li>`;
                htmlBuilder += `</ul></div>`;
            } else {
                htmlBuilder += `<div id="sec6"></div>`;
            }

            if (peopleInter || peopleNews || peopleEvent) {
                htmlBuilder += `<div id="sec7"><h4>7. 인물 소식</h4><ul>`;
                if (peopleInter) htmlBuilder += `<li><strong>인터뷰:</strong> ${peopleInter.replace(/\\n/g, '<br>')}</li>`;
                if (peopleNews) htmlBuilder += `<li><strong>개별 동정:</strong> ${peopleNews.replace(/\\n/g, '<br>')}</li>`;
                if (peopleEvent) htmlBuilder += `<li><strong>경조사:</strong> ${peopleEvent.replace(/\\n/g, '<br>')}</li>`;
                htmlBuilder += `</ul></div>`;
            } else {
                htmlBuilder += `<div id="sec7"></div>`;
            }

            if (articleSummary) {
                htmlBuilder += `<div id="sec8"><h4>8. 기고문</h4><ul>`;
                let cleanArt = articleSummary.replace(/\\n/g, '\n');
                let articles = cleanArt.split(/(?=\[.*?\])/g);
                articles.forEach(art => {
                    let trimmedArt = art.trim();
                    if (trimmedArt) {
                        htmlBuilder += `<li>${trimmedArt.replace(/\\n/g, '<br>')}</li>`;
                    }
                });
                htmlBuilder += `</ul></div>`;
            } else {
                htmlBuilder += `<div id="sec8"></div>`;
            }

            return htmlBuilder;
        }

        async function loadAllSheetData() {
            try {
                // 1. 교정본 데이터 로드
                const respCorrect = await fetch(correctCsvUrl);
                if (respCorrect.ok) {
                    const csvText = await respCorrect.text();
                    const rows = parseCSV(csvText);
                    for (let j = 1; j < rows.length; j++) {
                        const cols = rows[j].map(c => c.trim());
                        if (cols.length < 3) continue;
                        const matches = (cols[1] + " " + cols[2]).match(/(\d+)/g);
                        if (!matches || matches.length === 0) continue;
                        const issueNum = parseInt(matches[0], 10);
                        const paddedNum = String(issueNum).padStart(3, '0');
                        let pubDate = cols[3] || `${paddedNum}호`;

                        let htmlBuilder = buildStructuredHtml(cols);
                        correctMap[issueNum] = {
                            title: `${pubDate} - 통권 ${paddedNum}호 교정본`,
                            content: htmlBuilder
                        };
                    }
                }

                // 2. 원본 탭 데이터 로드 (gid=239571560)
                const respOriginal = await fetch(originalCsvUrl);
                if (respOriginal.ok) {
                    const csvTextOrig = await respOriginal.text();
                    const rowsOrig = parseCSV(csvTextOrig);
                    for (let j = 1; j < rowsOrig.length; j++) {
                        const cols = rowsOrig[j].map(c => c.trim());
                        if (cols.length < 3) continue;
                        const matches = (cols[1] + " " + cols[2]).match(/(\d+)/g);
                        if (!matches || matches.length === 0) continue;
                        const issueNum = parseInt(matches[0], 10);
                        const paddedNum = String(issueNum).padStart(3, '0');
                        let pubDate = cols[3] || `${paddedNum}호`;

                        let htmlBuilder = buildStructuredHtml(cols);
                        originalMap[issueNum] = {
                            title: `${pubDate} - 통권 ${paddedNum}호 원본`,
                            content: htmlBuilder
                        };
                    }
                }
            } catch (e) {
                console.error("시트 데이터 로드 오류:", e);
            }
        }

        async function loadCalendarData() {
            try {
                await loadAllSheetData();
                const respPdf = await fetch(pdfCsvUrl);
                const pdfCsvText = await respPdf.text();
                const pdfRows = parseCSV(pdfCsvText);
                let issueMap = {};
                for (let j = 1; j < pdfRows.length; j++) {
                    const pCols = pdfRows[j].map(c => c.trim());
                    if (pCols.length < 3) continue;
                    const fileName = pCols[0];
                    const fileUrl = pCols[2];
                    const colDate = pCols.length > 4 ? pCols[4] : '';
                    const matches = fileName.match(/(\d+)/g);
                    if (!matches || matches.length === 0) continue;
                    let issueNumber = parseInt(matches[0], 10);
                    if (fileName.includes('100+1')) {
                        issueNumber = 101;
                    }
                    if (issueNumber > 180) continue;
                    const paddedNum = String(issueNumber).padStart(3, '0');
                    const pdfLink = (fileUrl && fileUrl.startsWith('http')) ? fileUrl : '#';
                    globalPdfMap[issueNumber] = pdfLink;
                    globalPdfMap[String(issueNumber)] = pdfLink;
                    globalPdfMap[paddedNum] = pdfLink;
                    const matchDate = colDate.match(/(\d{4})\s*년\s*(\d{1,2})\s*월/);
                    if (!matchDate) continue;
                    const year = parseInt(matchDate[1], 10);
                    const month = parseInt(matchDate[2], 10);
                    if (year > 2003 || (year === 2003 && month > 11)) continue;
                    
                    issueMap[`${year}-${month}`] = {
                        issueNo: paddedNum, summary: "요약", rawNum: issueNumber, status: "교정", link: pdfLink
                    };
                }
                renderCalendarMatrix(issueMap);
            } catch (error) {
                console.error("데이터 연동 실패:", error);
                document.getElementById('calendar-body').innerHTML = `<tr><td colspan="13" class="loading" style="color:red;">데이터를 불러오는 중 오류가 발생했습니다.</td></tr>`;
            }
        }

        // [요약] 버튼 클릭 시 (원본 모달 창)
        function openSummaryModal(issueNum, year, month) {
            const modal = document.getElementById('summary-modal');
            const titleElem = document.getElementById('summary-modal-title');
            const textElem = document.getElementById('summary-modal-text');
            
            titleElem.textContent = `${year}년 ${month}월 - 통권 ${String(issueNum).padStart(3, '0')}호 원본`;
            if (originalMap[issueNum]) {
                textElem.innerHTML = originalMap[issueNum].content;
            } else {
                textElem.innerHTML = `<p>통권 ${issueNum}호에 대한 원본 시트 데이터가 아직 없습니다.</p>`;
            }
            modal.style.display = 'flex';
            history.pushState({ modalOpen: true }, '', window.location.href);
        }

        // [교정] 버튼 클릭 시 (3열 레이아웃 작업실 팝업 연동)
        function openCorrectModal(issueNum, year, month) {
            const modal = document.getElementById('correct-modal');
            const titleElem = document.getElementById('correct-modal-title');
            const pdfWrapper = document.getElementById('pdf-btn-wrapper');
            const origTextElem = document.getElementById('original-content-text');
            const correctTextElem = document.getElementById('correct-content-text');

            titleElem.textContent = `${year}년 ${month}월 - 통권 ${String(issueNum).padStart(3, '0')}호 교정 작업실`;

            // 1열 목차 상단: PDF 원본 새 창 열기 버튼 구성
            const pdfUrl = globalPdfMap[issueNum] || globalPdfMap[String(issueNum).padStart(3, '0')];
            if (pdfUrl && pdfUrl !== '#') {
                pdfWrapper.innerHTML = `<a href="${pdfUrl}" target="_blank" class="pdf-open-btn">📄 PDF 원본 새 창 열기</a>`;
            } else {
                pdfWrapper.innerHTML = `<div style="font-size:0.8rem; color:#dc2626; text-align:center; padding:6px;">PDF 미연동</div>`;
            }

            // 2열: '원본' 탭 내용 로드
            if (originalMap[issueNum]) {
                origTextElem.innerHTML = originalMap[issueNum].content;
            } else {
                origTextElem.innerHTML = `<p>통권 ${issueNum}호에 대한 '원본' 탭 데이터가 없습니다.</p>`;
            }

            // 3열: '교정본' 탭 내용 로드
            if (correctMap[issueNum]) {
                correctTextElem.innerHTML = correctMap[issueNum].content;
            } else {
                correctTextElem.innerHTML = `<p>통권 ${issueNum}호에 대한 '교정본' 탭 데이터가 없습니다.</p>`;
            }

            modal.style.display = 'flex';
            history.pushState({ modalOpen: true }, '', window.location.href);
        }

        // 목차 항목 클릭 시 우측 두 개 화면(원본, 교정본) 동시에 해당 섹션 위치로 스크롤 동기화
        function scrollToSection(secId) {
            const origBox = document.getElementById('original-content-text');
            const corrBox = document.getElementById('correct-content-text');
            
            const origTarget = origBox.querySelector(`#${secId}`);
            const corrTarget = corrBox.querySelector(`#${secId}`);

            if (origTarget) {
                origBox.scrollTo({ top: origTarget.offsetTop - 10, behavior: 'smooth' });
            }
            if (corrTarget) {
                corrBox.scrollTo({ top: corrTarget.offsetTop - 10, behavior: 'smooth' });
            }
        }

        function closeModal() {
            const sumModal = document.getElementById('summary-modal');
            const corModal = document.getElementById('correct-modal');
            if (sumModal.style.display === 'flex' || corModal.style.display === 'flex') {
                sumModal.style.display = 'none';
                corModal.style.display = 'none';
                if (history.state && history.state.modalOpen) {
                    history.back();
                }
            }
        }

        window.addEventListener('popstate', function(event) {
            closeModal();
        });

        function getEstimatedMissingNumber(targetYear, targetMonth, issueMap) {
            const startYear = 1984, startMonth = 3;
            const targetIndex = (targetYear - startYear) * 12 + (targetMonth - 1);
            const baseIndex = (startYear - startYear) * 12 + (startMonth - 1);
            if (targetIndex < baseIndex) return "";
            if (targetYear > 2003 || (targetYear === 2003 && targetMonth > 11)) return "";
            let prevNum = null, prevDist = Infinity;
            let nextNum = null, nextDist = Infinity;
            for (let y = 1984; y <= 2003; y++) {
                for (let m = 1; m <= 12; m++) {
                    if (y === 1984 && m < 3) continue;
                    if (y === 2003 && m > 11) continue;
                    const idx = (y - startYear) * 12 + (m - 1);
                    const data = issueMap[`${y}-${m}`];
                    if (data && data.rawNum !== undefined && data.rawNum <= 180) {
                        const dist = idx - targetIndex;
                        if (dist < 0 && Math.abs(dist) < prevDist) {
                            prevDist = Math.abs(dist);
                            prevNum = data.rawNum;
                        } else if (dist > 0 && dist < nextDist) {
                            nextDist = dist;
                            nextNum = data.rawNum;
                        }
                    }
                }
            }
            let estimated = null;
            if (prevNum !== null) {
                estimated = prevNum + prevDist;
            } else if (nextNum !== null) {
                estimated = nextNum - nextDist;
            }
            if (estimated !== null && estimated > 0 && estimated <= 180) {
                let exists = false;
                for (let key in issueMap) {
                    if (issueMap[key].rawNum === estimated) {
                        exists = true;
                        break;
                    }
                }
                if (!exists) {
                    return String(estimated).padStart(3, '0');
                }
            }
            return "";
        }

        function renderCalendarMatrix(issueMap) {
            const tbody = document.getElementById('calendar-body');
            tbody.innerHTML = '';
            const startYear = 1984;
            const endYear = 2003;
            let existingNums = new Set();
            for (let key in issueMap) {
                existingNums.add(issueMap[key].rawNum);
            }
            let unmappedMissing = [];
            for (let n = 1; n <= 180; n++) {
                if (existingNums.has(n)) continue;
                let canBeMapped = false;
                for (let y = startYear; y <= endYear; y++) {
                    for (let m = 1; m <= 12; m++) {
                        if (y === 1984 && m < 3) continue;
                        if (y === 2003 && m > 11) continue;
                        const k = `${y}-${m}`;
                        if (issueMap[k] === undefined) {
                            const est = getEstimatedMissingNumber(y, m, issueMap);
                            if (est && parseInt(est, 10) === n) {
                                canBeMapped = true;
                                break;
                            }
                        }
                    }
                    if (canBeMapped) break;
                }
                if (!canBeMapped) {
                    const issueStr = `${n}호`;
                    const pdfUrl = globalPdfMap[n] || globalPdfMap[String(n)] || globalPdfMap[String(n).padStart(3, '0')];
                    if (pdfUrl && pdfUrl !== '#') {
                        unmappedMissing.push(`<a href="${pdfUrl}" target="_blank" class="missing-link">${issueStr}</a>`);
                    } else {
                        unmappedMissing.push(`<span class="missing-none">${n}호(PDF 없음)</span>`);
                    }
                }
            }
            const noticeContainer = document.getElementById('unmapped-missing-container');
            if (unmappedMissing.length > 0) {
                noticeContainer.innerHTML = `<strong>표기 못한 누락 호수:</strong> ${unmappedMissing.join(', ')}`;
            } else {
                noticeContainer.innerHTML = `<strong>표기 못한 누락 호수:</strong> 없음`;
            }
            for (let year = startYear; year <= endYear; year++) {
                const tr = document.createElement('tr');
                const thYear = document.createElement('th');
                thYear.textContent = year;
                tr.appendChild(thYear);
                for (let month = 1; month <= 12; month++) {
                    const td = document.createElement('td');
                    const key = `${year}-${month}`;
                    const data = issueMap[key];
                    if (data !== undefined) {
                        const linkAttr = (data.link && data.link !== '#') ? `href="${data.link}" target="_blank"` : `href="#" onclick="alert('${year}년 ${month}월 - ${data.issueNo}호 원본 파일이 아직 연동되지 않았습니다.'); return false;"`;
                        td.innerHTML = `
                            <div class="cell-content">
                                <a ${linkAttr} class="cell-block">
                                    <span class="cell-issue">${data.issueNo}</span>
                                </a>
                                <div class="cell-block" onclick="openSummaryModal(${data.rawNum}, ${year}, ${month})">
                                    <span class="cell-summary">${data.summary}</span>
                                </div>
                                <div class="cell-block" onclick="openCorrectModal(${data.rawNum}, ${year}, ${month})">
                                    <span class="cell-status">${data.status}</span>
                                </div>
                            </div>
                        `;
                    } else {
                        const missingNo = getEstimatedMissingNumber(year, month, issueMap);
                        if (missingNo) {
                            td.innerHTML = `<span class="missing-cell-issue">${missingNo}</span>`;
                        } else {
                            td.style.backgroundColor = '#fafafa';
                        }
                    }
                    tr.appendChild(td);
                }
                tbody.appendChild(tr);
            }
        }

        window.onload = loadCalendarData;
    </script>
