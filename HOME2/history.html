<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>촛불회 회보 연혁 (History Viewer)</title>
    <!-- Tailwind CSS를 활용하여 깔끔하고 반응형 레이아웃 구성 -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 마크다운 파싱을 위한 marked.js 라이브러리 연동 -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.js"></script>
    <style>
        body { font-family: 'Malgun Gothic', sans-serif; }
        /* 본문 마크다운 출력 스타일 조절 */
        .content-box ul { list-style-type: disc; padding-left: 20px; }
        .content-box li { margin-bottom: 8px; line-height: 1.6; }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 min-h-screen flex flex-col">

    <!-- 상단 헤더 -->
    <header class="bg-amber-700 text-white p-4 shadow-md">
        <div class="max-w-6xl mx-auto flex justify-between items-center">
            <h1 class="text-xl font-bold">촛불회 회보 연혁 (History Viewer)</h1>
            <span class="text-xs bg-amber-800 px-3 py-1 rounded-full">history.md 연동</span>
        </div>
    </header>

    <main class="max-w-6xl mx-auto p-4 flex-grow w-full grid grid-cols-1 md:grid-cols-4 gap-6 mt-4">
        
        <!-- 좌측/상단 메뉴 영역 (슬라이드 4번 구상 반영) -->
        <aside class="md:col-span-1 space-y-4">
            <div class="bg-white p-4 rounded-lg shadow-sm border border-gray-200">
                <h2 class="font-bold text-gray-700 mb-3 border-b pb-2">분류 선택</h2>
                <!-- 전체 보기 버튼 -->
                <button onclick="filterContent('all')" class="w-full text-left px-3 py-2 rounded mb-2 bg-amber-700 text-white font-semibold transition hover:bg-amber-800">
                    [전체 보기]
                </button>
                
                <!-- 대분류 및 소분류 버튼 그룹 -->
                <div id="category-menu" class="space-y-3 mt-4 text-sm">
                    <!-- JavaScript를 통해 history.md의 대/소분류 항목을 동적으로 생성하거나 아래처럼 수동 구성 가능 -->
                    <div class="category-group">
                        <button onclick="filterContent('info')" class="w-full text-left font-bold text-gray-800 hover:text-amber-700 py-1">1. 회보 정보</button>
                    </div>
                    <div class="category-group">
                        <button onclick="filterContent('organization')" class="w-full text-left font-bold text-gray-800 hover:text-amber-700 py-1">2. 조직 및 체계 변화</button>
                    </div>
                    <div class="category-group">
                        <button onclick="filterContent('events')" class="w-full text-left font-bold text-gray-800 hover:text-amber-700 py-1">3. 주요 이벤트 및 마일스톤</button>
                    </div>
                    <div class="category-group">
                        <button onclick="filterContent('meetings')" class="w-full text-left font-bold text-gray-800 hover:text-amber-700 py-1">4. 주요 회의</button>
                    </div>
                    <div class="category-group">
                        <button onclick="filterContent('volunteer')" class="w-full text-left font-bold text-gray-800 hover:text-amber-700 py-1">5. 봉사 활동</button>
                    </div>
                    <div class="category-group">
                        <button onclick="filterContent('subgroups')" class="w-full text-left font-bold text-gray-800 hover:text-amber-700 py-1">6. 소집단 활동</button>
                    </div>
                    <div class="category-group">
                        <button onclick="filterContent('people')" class="w-full text-left font-bold text-gray-800 hover:text-amber-700 py-1">7. 인물 소식</button>
                    </div>
                </div>
            </div>
        </aside>

        <!-- 우측 본문 출력 영역 (하단 박스 형태) -->
        <section class="md:col-span-3 bg-white p-6 rounded-lg shadow-sm border border-gray-200">
            <div id="loading" class="text-center py-10 text-gray-500">GitHub에서 history.md 데이터를 불러오는 중입니다...</div>
            <!-- 마크다운 내용이 렌더링되어 들어가는 하단 박스 -->
            <div id="content-view" class="content-box prose max-w-none text-sm hidden"></div>
        </section>

    </main>

    <!-- 푸터 -->
    <footer class="bg-gray-100 text-center py-4 text-xs text-gray-500 border-t mt-8">
        촛불회 회보 아카이브 시스템 &copy; 2026
    </footer>

    <!-- GitHub 연동 및 필터링 핵심 자바스크립트 로직 -->
    <script>
        let rawMarkdownText = "";
        // GitHub에 업로드된 history.md의 Raw 파일 주소 (실제 저장하신 저장소 주소로 확인 필요)
        const historyMdUrl = "https://raw.githubusercontent.com/clclub1975/clmb/main/HOME2/history.md";

        // 페이지 로드 시 history.md 파일 비동기 페치
        async function loadHistoryData() {
            try {
                const response = await fetch(historyMdUrl);
                if (!response.ok) throw new Error("네트워크 응답에 문제가 있습니다.");
                rawMarkdownText = await response.text();
                
                // 로딩 문구 숨기고 기본 전체 내용 렌더링
                document.getElementById('loading').style.display = 'none';
                const contentView = document.getElementById('content-view');
                contentView.style.display = 'block';
                contentView.innerHTML = marked.parse(rawMarkdownText);
            } catch (error) {
                document.getElementById('loading').innerHTML = "데이터를 불러오는 데 실패했습니다. 파일 경로를 확인해 주세요.";
                console.error(error);
            }
        }

        // 버튼 클릭 시 특정 앵커 ID 또는 키워드 기준으로 내용 필터링
        function filterContent(anchorId) {
            const contentView = document.getElementById('content-view');
            
            if (anchorId === 'all') {
                contentView.innerHTML = marked.parse(rawMarkdownText);
                window.scrollTo({ top: 0, behavior: 'smooth' });
                return;
            }

            // history.md 내에 심어둔 앵커 패턴(`<a id="info">`)을 기준으로 파싱 및 추출
            // 예: 특정 대분류 섹션의 헤딩부터 다음 대분류 전까지의 텍스트 조각을 잘라냄
            const sections = rawMarkdownText.split('## ');
            let targetSection = "";

            for (let sec of sections) {
                if (sec.includes(`id="${anchorId}"`) || sec.startsWith(`${anchorId.charAt(0)}.`)) {
                    targetSection = "## " + sec;
                    break;
                }
            }

            if (targetSection) {
                contentView.innerHTML = marked.parse(targetSection);
            } else {
                contentView.innerHTML = "<p class='text-gray-500'>해당 항목의 내용을 찾을 수 없습니다.</p>";
            }
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // 실행
        loadHistoryData();
    </script>
</body>
</html>
