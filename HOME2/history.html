<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>촛불회 회보 연혁 (History Viewer)</title>
    <!-- Tailwind CSS 적용 -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 마크다운 파싱을 위한 marked.js -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.js"></script>
    <style>
        body { font-family: 'Malgun Gothic', sans-serif; }
        .content-box ul { list-style-type: disc; padding-left: 20px; }
        .content-box li { margin-bottom: 8px; line-height: 1.6; }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 min-h-screen flex flex-col">

    <!-- 상단 헤더 -->
    <header class="bg-amber-700 text-white p-4 shadow-md">
        <div class="max-w-6xl mx-auto flex justify-between items-center">
            <h1 class="text-xl font-bold">촛불회 회보 연혁 (History Viewer)</h1>
            <span class="text-xs bg-amber-800 px-3 py-1 rounded-full">history.md 연동</span>
        </div>
    </header>

    <main class="max-w-6xl mx-auto p-6 flex-grow w-full space-y-6">
        
        <!-- 분류 선택 영역 (실제 대/소분류 트리 구조) -->
        <section class="bg-white p-5 rounded-lg shadow-sm border border-gray-200">
            <h2 class="font-bold text-gray-700 mb-4 border-b pb-2 text-base">분류 선택</h2>
            
            <div id="filter-container" class="space-y-4 text-sm">
                <!-- [전체 보기] 체크박스 -->
                <div class="flex items-center space-x-2 font-semibold">
                    <input type="checkbox" id="chk-all" onchange="handleAllCheck(this)" class="w-4 h-4 text-amber-700 rounded border-gray-300 focus:ring-amber-600">
                    <label for="chk-all" class="cursor-pointer text-amber-800">[전체 보기]</label>
                </div>

                <div class="space-y-3 pl-2 border-l-2 border-gray-100" id="category-tree">
                    
                    <!-- 1. 회보 정보 -->
                    <div class="space-y-1">
                        <div class="flex items-center space-x-2 font-bold text-gray-800">
                            <input type="checkbox" onchange="handleCategoryToggle(this, 'sub-1')" class="cat-chk w-4 h-4 text-amber-700 rounded border-gray-300">
                            <label class="cursor-pointer">회보 정보</label>
                        </div>
                        <div id="sub-1" class="pl-6 space-y-1 text-xs text-gray-600">
                            <div><input type="checkbox" value="회보 정보 - 한 줄 요약" onchange="handleSubCheck()" class="sub-chk w-3 h-3 text-amber-600 rounded border-gray-300"> <span>회보 정보 - 한 줄 요약</span></div>
                        </div>
                    </div>

                    <!-- 2. 조직 및 체계 변화 -->
                    <div class="space-y-1">
                        <div class="flex items-center space-x-2 font-bold text-gray-800">
                            <input type="checkbox" onchange="handleCategoryToggle(this, 'sub-2')" class="cat-chk w-4 h-4 text-amber-700 rounded border-gray-300">
                            <label class="cursor-pointer">조직 및 체계 변화</label>
                        </div>
                        <div id="sub-2" class="pl-6 space-y-1 text-xs text-gray-600">
                            <div><input type="checkbox" value="조직 및 체계 변화 - 임원진" onchange="handleSubCheck()" class="sub-chk w-3 h-3 text-amber-600 rounded border-gray-300"> <span>임원진</span></div>
                            <div><input type="checkbox" value="조직 및 체계 변화 - 체계 변화" onchange="handleSubCheck()" class="sub-chk w-3 h-3 text-amber-600 rounded border-gray-300"> <span>체계 변화</span></div>
                        </div>
                    </div>

                    <!-- 3. 주요 이벤트 및 마일스톤 -->
                    <div class="space-y-1">
                        <div class="flex items-center space-x-2 font-bold text-gray-800">
                            <input type="checkbox" onchange="handleCategoryToggle(this, 'sub-3')" class="cat-chk w-4 h-4 text-amber-700 rounded border-gray-300">
                            <label class="cursor-pointer">주요 이벤트 및 마일스톤</label>
                        </div>
                        <div id="sub-3" class="pl-6 space-y-1 text-xs text-gray-600">
                            <div><input type="checkbox" value="주요 이벤트 및 마일스톤 - 이벤트" onchange="handleSubCheck()" class="sub-chk w-3 h-3 text-amber-600 rounded border-gray-300"> <span>이벤트</span></div>
                            <div><input type="checkbox" value="주요 이벤트 및 마일스톤 - 역사적 사실" onchange="handleSubCheck()" class="sub-chk w-3 h-3 text-amber-600 rounded border-gray-300"> <span>역사적 사실</span></div>
                            <div><input type="checkbox" value="주요 이벤트 및 마일스톤 - 애로 사항" onchange="handleSubCheck()" class="sub-chk w-3 h-3 text-amber-600 rounded border-gray-300"> <span>애로 사항</span></div>
                        </div>
                    </div>

                    <!-- 4. 주요 회의 -->
                    <div class="space-y-1">
                        <div class="flex items-center space-x-2 font-bold text-gray-800">
                            <input type="checkbox" onchange="handleCategoryToggle(this, 'sub-4')" class="cat-chk w-4 h-4 text-amber-700 rounded border-gray-300">
                            <label class="cursor-pointer">주요 회의</label>
                        </div>
                        <div id="sub-4" class="pl-6 space-y-1 text-xs text-gray-600">
                            <div><input type="checkbox" value="주요 회의 - 회의 종류" onchange="handleSubCheck()" class="sub-chk w-3 h-3 text-amber-600 rounded border-gray-300"> <span>회의 종류</span></div>
                            <div><input type="checkbox" value="주요 회의 - 의결 사항" onchange="handleSubCheck()" class="sub-chk w-3 h-3 text-amber-600 rounded border-gray-300"> <span>의결 사항</span></div>
                        </div>
                    </div>

                    <!-- 5. 봉사 활동 -->
                    <div class="space-y-1">
                        <div class="flex items-center space-x-2 font-bold text-gray-800">
                            <input type="checkbox" onchange="handleCategoryToggle(this, 'sub-5')" class="cat-chk w-4 h-4 text-amber-700 rounded border-gray-300">
                            <label class="cursor-pointer">봉사 활동</label>
                        </div>
                        <div id="sub-5" class="pl-6 space-y-1 text-xs text-gray-600">
                            <div><input type="checkbox" value="봉사 활동 - 정기 봉사" onchange="handleSubCheck()" class="sub-chk w-3 h-3 text-amber-600 rounded border-gray-300"> <span>정기 봉사</span></div>
                            <div><input type="checkbox" value="봉사 활동 - 기타 봉사" onchange="handleSubCheck()" class="sub-chk w-3 h-3 text-amber-600 rounded border-gray-300"> <span>기타 봉사</span></div>
                        </div>
                    </div>

                    <!-- 6. 소집단 활동 -->
                    <div class="space-y-1">
                        <div class="flex items-center space-x-2 font-bold text-gray-800">
                            <input type="checkbox" onchange="handleCategoryToggle(this, 'sub-6')" class="cat-chk w-4 h-4 text-amber-700 rounded border-gray-300">
                            <label class="cursor-pointer">소집단 활동</label>
                        </div>
                        <div id="sub-6" class="pl-6 space-y-1 text-xs text-gray-600">
                            <div><input type="checkbox" value="소집단 활동 - 학술/문화" onchange="handleSubCheck()" class="sub-chk w-3 h-3 text-amber-600 rounded border-gray-300"> <span>학술/문화</span></div>
                            <div><input type="checkbox" value="소집단 활동 - 친목/기타" onchange="handleSubCheck()" class="sub-chk w-3 h-3 text-amber-600 rounded border-gray-300"> <span>친목/기타</span></div>
                        </div>
                    </div>

                    <!-- 7. 인물 소식 -->
                    <div class="space-y-1">
                        <div class="flex items-center space-x-2 font-bold text-gray-800">
                            <input type="checkbox" onchange="handleCategoryToggle(this, 'sub-7')" class="cat-chk w-4 h-4 text-amber-700 rounded border-gray-300">
                            <label class="cursor-pointer">인물 소식</label>
                        </div>
                        <div id="sub-7" class="pl-6 space-y-1 text-xs text-gray-600">
                            <div><input type="checkbox" value="인물 소식 - 인물 동향" onchange="handleSubCheck()" class="sub-chk w-3 h-3 text-amber-600 rounded border-gray-300"> <span>인물 동향</span></div>
                            <div><input type="checkbox" value="인물 소식 - 경조사 및 소식" onchange="handleSubCheck()" class="sub-chk w-3 h-3 text-amber-600 rounded border-gray-300"> <span>경조사 및 소식</span></div>
                            <div><input type="checkbox" value="인물 소식 - 인터뷰 및 탐방" onchange="handleSubCheck()" class="sub-chk w-3 h-3 text-amber-600 rounded border-gray-300"> <span>인터뷰 및 탐방</span></div>
                        </div>
                    </div>

                    <!-- 8. 기고문 -->
                    <div class="space-y-1">
                        <div class="flex items-center space-x-2 font-bold text-gray-800">
                            <input type="checkbox" onchange="handleCategoryToggle(this, 'sub-8')" class="cat-chk w-4 h-4 text-amber-700 rounded border-gray-300">
                            <label class="cursor-pointer">기고문</label>
                        </div>
                        <div id="sub-8" class="pl-6 space-y-1 text-xs text-gray-600">
                            <div><input type="checkbox" value="기고문 - 회원 기고문" onchange="handleSubCheck()" class="sub-chk w-3 h-3 text-amber-600 rounded border-gray-300"> <span>회원 기고문</span></div>
                        </div>
                    </div>

                </div>
            </div>
        </section>

        <!-- 하단 본문 출력 박스 영역 (스크롤 적용) -->
        <section class="bg-white p-6 rounded-lg shadow-sm border border-gray-200">
            <div id="loading" class="text-center py-10 text-gray-500">GitHub에서 history.md 데이터를 불러오는 중입니다...</div>
            <div id="content-view" class="content-box prose max-w-none text-sm hidden max-h-[600px] overflow-y-auto pr-4 space-y-6"></div>
        </section>

    </main>

    <!-- 푸터 -->
    <footer class="bg-gray-100 text-center py-4 text-xs text-gray-500 border-t mt-8">
        촛불회 회보 아카이브 시스템 &copy; 2026
    </footer>

    <!-- 자바스크립트 로직 -->
    <script>
        let rawMarkdownText = "";
        const historyMdUrl = "https://raw.githubusercontent.com/clclub1975/clmb/main/HOME2/history.md";

        async function loadHistoryData() {
            try {
                const response = await fetch(historyMdUrl);
                if (!response.ok) throw new Error("네트워크 응답 오류");
                rawMarkdownText = await response.text();
                
                document.getElementById('loading').style.display = 'none';
                const contentView = document.getElementById('content-view');
                contentView.style.display = 'block';
                
                document.getElementById('chk-all').checked = true;
                renderContent();
            } catch (error) {
                document.getElementById('loading').innerHTML = "데이터를 불러오는 데 실패했습니다. 파일 경로를 확인해 주세요.";
                console.error(error);
            }
        }

        // 전체 보기 체크박스 제어
        function handleAllCheck(masterChk) {
            const allChks = document.querySelectorAll('input[type="checkbox"]:not(#chk-all)');
            allChks.forEach(chk => chk.checked = false);
            renderContent();
        }

        // 대분류 체크 시 하위 소분류 일괄 체크/해제
        function handleCategoryToggle(catChk, subContainerId) {
            document.getElementById('chk-all').checked = false;
            const subContainer = document.getElementById(subContainerId);
            const subChks = subContainer.querySelectorAll('.sub-chk');
            
            subChks.forEach(chk => {
                chk.checked = catChk.checked;
            });
            renderContent();
        }

        // 소분류 체크 변경 시
        function handleSubCheck() {
            document.getElementById('chk-all').checked = false;
            renderContent();
        }

        // 체크된 소분류 타이틀에 해당하는 마크다운 섹션만 추출하여 렌더링
        function renderContent() {
            const contentView = document.getElementById('content-view');
            const isAllChecked = document.getElementById('chk-all').checked;

            if (isAllChecked || !rawMarkdownText) {
                contentView.innerHTML = marked.parse(rawMarkdownText);
                return;
            }

            const checkedSubChks = document.querySelectorAll('.sub-chk:checked');
            if (checkedSubChks.length === 0) {
                contentView.innerHTML = "<p class='text-gray-500'>선택된 항목이 없습니다.</p>";
                return;
            }

            const targetSubTitles = Array.from(checkedSubChks).map(chk => chk.value);

            // history.md 내용을 '## ' 기준으로 섹션 단위로 쪼갬
            const sections = rawMarkdownText.split('## ');
            let filteredHtml = "";

            sections.forEach(sec => {
                // 각 섹션의 헤딩(예: "2.1 조직 및 체계 변화 - 임원진")이 체크된 소분류 이름과 일치하는지 확인
                for (let subTitle of targetSubTitles) {
                    if (sec.includes(subTitle)) {
                        filteredHtml += "## " + sec + "\n\n";
                        break;
                    }
                }
            });

            if (filteredHtml.trim() !== "") {
                contentView.innerHTML = marked.parse(filteredHtml);
            } else {
                contentView.innerHTML = "<p class='text-gray-500'>해당하는 내용을 찾을 수 없습니다.</p>";
            }
        }

        loadHistoryData();
    </script>
</body>
</html>
