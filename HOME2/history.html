<!DOCTYPE html>
<html lang="ko">
<head>
    <!-- v1.0: 4X4 그리드 검색 항목 레이아웃 적용, 검색할 목록 토글 및 v1.0 버전 명시 -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>촛불회 연혁 살펴보기 (History Viewer)</title>
    <!-- Tailwind CSS 적용 -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 마크다운 파싱을 위한 marked.js -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.js"></script>
    <style>
        body { font-family: 'Malgun Gothic', sans-serif; word-break: keep-all; }
        .content-box ul { list-style-type: disc; padding-left: 20px; }
        .content-box li { margin-bottom: 8px; line-height: 1.6; }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 min-h-screen flex flex-col">

    <!-- 상단 헤더 -->
    <header class="bg-amber-700 text-white p-4 shadow-md">
        <div class="max-w-6xl mx-auto flex justify-between items-center">
            <div class="flex items-center space-x-3">
                <h1 class="text-xl font-bold">🕯️ 촛불회 연혁 살펴보기</h1>
                <span class="text-xs bg-amber-900 text-amber-200 px-2.5 py-0.5 rounded-full font-semibold">v1.0</span>
            </div>
            <a href="index.html" class="text-xs bg-amber-800 hover:bg-amber-900 text-white px-3 py-1.5 rounded-md transition font-medium">HOME으로 가기</a>
        </div>
    </header>

    <main class="max-w-6xl mx-auto p-4 md:p-6 flex-grow w-full space-y-6">
        
        <!-- 검색 항목 패널 (디폴트 열림, 4X4 그리드 레이아웃) -->
        <section class="bg-white p-5 rounded-lg shadow-sm border border-gray-200">
            <div class="flex justify-between items-center mb-4 border-b pb-2">
                <h2 class="font-bold text-gray-700 text-base">검색 항목</h2>
                <button onclick="toggleFilterPanel()" id="toggle-btn" class="text-xs text-amber-700 font-semibold hover:underline">
                    검색할 목록 닫기 ▲
                </button>
            </div>
            
            <!-- 4X4 그리드 컨테이너 (총 16개 항목: 전체선택 + 15개 소분류) -->
            <div id="filter-panel" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-4 gap-3 text-sm">
                
                <!-- 1. [전체 선택] (첫 번째 소분류 항목처럼 취급) -->
                <label class="flex items-center space-x-2 p-2 rounded bg-amber-50 border border-amber-200 cursor-pointer hover:bg-amber-100 transition">
                    <input type="checkbox" id="chk-all" onchange="handleAllCheck(this)" class="w-4 h-4 text-amber-700 rounded border-gray-300 focus:ring-amber-600">
                    <span class="font-bold text-amber-900">[전체 선택]</span>
                </label>

                <!-- 2. 회보 정보 - 한 줄 요약 -->
                <label class="flex items-center space-x-2 p-2 rounded border border-gray-100 bg-gray-50 cursor-pointer hover:bg-gray-100 transition">
                    <input type="checkbox" value="회보 정보 - 한 줄 요약" onchange="handleSubCheck()" class="sub-chk w-4 h-4 text-amber-600 rounded border-gray-300">
                    <span class="text-gray-700 text-xs font-medium">회보 정보 (한 줄 요약)</span>
                </label>

                <!-- 3. 조직 및 체계 변화 - 임원진 -->
                <label class="flex items-center space-x-2 p-2 rounded border border-gray-100 bg-gray-50 cursor-pointer hover:bg-gray-100 transition">
                    <input type="checkbox" value="조직 및 체계 변화 - 임원진" onchange="handleSubCheck()" class="sub-chk w-4 h-4 text-amber-600 rounded border-gray-300">
                    <span class="text-gray-700 text-xs font-medium">조직 및 체계 (임원진)</span>
                </label>

                <!-- 4. 조직 및 체계 변화 - 체계 변화 -->
                <label class="flex items-center space-x-2 p-2 rounded border border-gray-100 bg-gray-50 cursor-pointer hover:bg-gray-100 transition">
                    <input type="checkbox" value="조직 및 체계 변화 - 체계 변화" onchange="handleSubCheck()" class="sub-chk w-4 h-4 text-amber-600 rounded border-gray-300">
                    <span class="text-gray-700 text-xs font-medium">조직 및 체계 (체계변화)</span>
                </label>

                <!-- 5. 주요 이벤트 및 마일스톤 - 이벤트 -->
                <label class="flex items-center space-x-2 p-2 rounded border border-gray-100 bg-gray-50 cursor-pointer hover:bg-gray-100 transition">
                    <input type="checkbox" value="주요 이벤트 및 마일스톤 - 이벤트" onchange="handleSubCheck()" class="sub-chk w-4 h-4 text-amber-600 rounded border-gray-300">
                    <span class="text-gray-700 text-xs font-medium">이벤트 및 마일스톤 (이벤트)</span>
                </label>

                <!-- 6. 주요 이벤트 및 마일스톤 - 역사적 사실 -->
                <label class="flex items-center space-x-2 p-2 rounded border border-gray-100 bg-gray-50 cursor-pointer hover:bg-gray-100 transition">
                    <input type="checkbox" value="주요 이벤트 및 마일스톤 - 역사적 사실" onchange="handleSubCheck()" class="sub-chk w-4 h-4 text-amber-600 rounded border-gray-300">
                    <span class="text-gray-700 text-xs font-medium">이벤트 (역사적 사실)</span>
                </label>

                <!-- 7. 주요 이벤트 및 마일스톤 - 애로 사항 -->
                <label class="flex items-center space-x-2 p-2 rounded border border-gray-100 bg-gray-50 cursor-pointer hover:bg-gray-100 transition">
                    <input type="checkbox" value="주요 이벤트 및 마일스톤 - 애로 사항" onchange="handleSubCheck()" class="sub-chk w-4 h-4 text-amber-600 rounded border-gray-300">
                    <span class="text-gray-700 text-xs font-medium">이벤트 (애로 사항)</span>
                </label>

                <!-- 8. 주요 회의 - 회의 종류 -->
                <label class="flex items-center space-x-2 p-2 rounded border border-gray-100 bg-gray-50 cursor-pointer hover:bg-gray-100 transition">
                    <input type="checkbox" value="주요 회의 - 회의 종류" onchange="handleSubCheck()" class="sub-chk w-4 h-4 text-amber-600 rounded border-gray-300">
                    <span class="text-gray-700 text-xs font-medium">주요 회의 (회의 종류)</span>
                </label>

                <!-- 9. 주요 회의 - 의결 사항 -->
                <label class="flex items-center space-x-2 p-2 rounded border border-gray-100 bg-gray-50 cursor-pointer hover:bg-gray-100 transition">
                    <input type="checkbox" value="주요 회의 - 의결 사항" onchange="handleSubCheck()" class="sub-chk w-4 h-4 text-amber-600 rounded border-gray-300">
                    <span class="text-gray-700 text-xs font-medium">주요 회의 (의결 사항)</span>
                </label>

                <!-- 10. 봉사 활동 - 정기 봉사 -->
                <label class="flex items-center space-x-2 p-2 rounded border border-gray-100 bg-gray-50 cursor-pointer hover:bg-gray-100 transition">
                    <input type="checkbox" value="봉사 활동 - 정기 봉사" onchange="handleSubCheck()" class="sub-chk w-4 h-4 text-amber-600 rounded border-gray-300">
                    <span class="text-gray-700 text-xs font-medium">봉사 활동 (정기 봉사)</span>
                </label>

                <!-- 11. 봉사 활동 - 기타 봉사 -->
                <label class="flex items-center space-x-2 p-2 rounded border border-gray-100 bg-gray-50 cursor-pointer hover:bg-gray-100 transition">
                    <input type="checkbox" value="봉사 활동 - 기타 봉사" onchange="handleSubCheck()" class="sub-chk w-4 h-4 text-amber-600 rounded border-gray-300">
                    <span class="text-gray-700 text-xs font-medium">봉사 활동 (기타 봉사)</span>
                </label>

                <!-- 12. 소집단 활동 - 학술/문화 -->
                <label class="flex items-center space-x-2 p-2 rounded border border-gray-100 bg-gray-50 cursor-pointer hover:bg-gray-100 transition">
                    <input type="checkbox" value="소집단 활동 - 학술/문화" onchange="handleSubCheck()" class="sub-chk w-4 h-4 text-amber-600 rounded border-gray-300">
                    <span class="text-gray-700 text-xs font-medium">소집단 활동 (학술/문화)</span>
                </label>

                <!-- 13. 소집단 활동 - 친목/기타 -->
                <label class="flex items-center space-x-2 p-2 rounded border border-gray-100 bg-gray-50 cursor-pointer hover:bg-gray-100 transition">
                    <input type="checkbox" value="소집단 활동 - 친목/기타" onchange="handleSubCheck()" class="sub-chk w-4 h-4 text-amber-600 rounded border-gray-300">
                    <span class="text-gray-700 text-xs font-medium">소집단 활동 (친목/기타)</span>
                </label>

                <!-- 14. 인물 소식 - 인물 동향 -->
                <label class="flex items-center space-x-2 p-2 rounded border border-gray-100 bg-gray-50 cursor-pointer hover:bg-gray-100 transition">
                    <input type="checkbox" value="인물 소식 - 인물 동향" onchange="handleSubCheck()" class="sub-chk w-4 h-4 text-amber-600 rounded border-gray-300">
                    <span class="text-gray-700 text-xs font-medium">인물 소식 (인물 동향)</span>
                </label>

                <!-- 15. 인물 소식 - 경조사 및 소식 -->
                <label class="flex items-center space-x-2 p-2 rounded border border-gray-100 bg-gray-50 cursor-pointer hover:bg-gray-100 transition">
                    <input type="checkbox" value="인물 소식 - 경조사 및 소식" onchange="handleSubCheck()" class="sub-chk w-4 h-4 text-amber-600 rounded border-gray-300">
                    <span class="text-gray-700 text-xs font-medium">인물 소식 (경조사)</span>
                </label>

                <!-- 16. 인물 소식 - 인터뷰 및 탐방 -->
                <label class="flex items-center space-x-2 p-2 rounded border border-gray-100 bg-gray-50 cursor-pointer hover:bg-gray-100 transition">
                    <input type="checkbox" value="인물 소식 - 인터뷰 및 탐방" onchange="handleSubCheck()" class="sub-chk w-4 h-4 text-amber-600 rounded border-gray-300">
                    <span class="text-gray-700 text-xs font-medium">인물 소식 (인터뷰/탐방)</span>
                </label>

            </div>
        </section>

        <!-- 하단 본문 출력 박스 영역 (스크롤 적용) -->
        <section class="bg-white p-6 rounded-lg shadow-sm border border-gray-200">
            <div id="loading" class="text-center py-10 text-gray-500">GitHub에서 history.md 데이터를 불러오는 중입니다...</div>
            <div id="content-view" class="content-box prose max-w-none text-sm hidden max-h-[600px] overflow-y-auto pr-4 space-y-6"></div>
        </section>

    </main>

    <!-- 푸터 -->
    <footer class="bg-gray-100 text-center py-4 text-xs text-gray-500 border-t mt-8">
        촛불회 회보 아카이브 시스템 &copy; 2026
    </footer>

    <!-- 자바스크립트 로직 -->
    <script>
        let rawMarkdownText = "";
        const historyMdUrl = "https://raw.githubusercontent.com/clclub1975/clmb/main/HOME2/history.md";

        async function loadHistoryData() {
            try {
                const response = await fetch(historyMdUrl);
                if (!response.ok) throw new Error("네트워크 응답 오류");
                rawMarkdownText = await response.text();
                
                document.getElementById('loading').style.display = 'none';
                const contentView = document.getElementById('content-view');
                contentView.style.display = 'block';
                
                // 초기 상태: 전체 선택 체크
                document.getElementById('chk-all').checked = true;
                renderContent();
            } catch (error) {
                document.getElementById('loading').innerHTML = "데이터를 불러오는 데 실패했습니다. 파일 경로를 확인해 주세요.";
                console.error(error);
            }
        }

        // 검색할 목록 패널 토글 함수
        function toggleFilterPanel() {
            const panel = document.getElementById('filter-panel');
            const btn = document.getElementById('toggle-btn');
            if (panel.style.display === 'none') {
                panel.style.display = 'grid';
                btn.innerText = '검색할 목록 닫기 ▲';
            } else {
                panel.style.display = 'none';
                btn.innerText = '검색할 목록 열기 ▼';
            }
        }

        // [전체 선택] 체크박스 제어
        function handleAllCheck(masterChk) {
            const subChks = document.querySelectorAll('.sub-chk');
            subChks.forEach(chk => chk.checked = false);
            renderContent();
        }

        // 소분류 체크 변경 시
        function handleSubCheck() {
            document.getElementById('chk-all').checked = false;
            renderContent();
        }

        // 체크된 소분류 타이틀에 해당하는 마크다운 섹션만 추출하여 렌더링
        function renderContent() {
            const contentView = document.getElementById('content-view');
            const isAllChecked = document.getElementById('chk-all').checked;

            if (isAllChecked || !rawMarkdownText) {
                contentView.innerHTML = marked.parse(rawMarkdownText);
                return;
            }

            const checkedSubChks = document.querySelectorAll('.sub-chk:checked');
            if (checkedSubChks.length === 0) {
                contentView.innerHTML = "<p class='text-gray-500'>선택된 항목이 없습니다.</p>";
                return;
            }

            const targetSubTitles = Array.from(checkedSubChks).map(chk => chk.value);

            // history.md 내용을 '## ' 기준으로 섹션 단위로 분할
            const sections = rawMarkdownText.split('## ');
            let filteredHtml = "";

            sections.forEach(sec => {
                for (let subTitle of targetSubTitles) {
                    if (sec.includes(subTitle)) {
                        filteredHtml += "## " + sec + "\n\n";
                        break;
                    }
                }
            });

            if (filteredHtml.trim() !== "") {
                contentView.innerHTML = marked.parse(filteredHtml);
            } else {
                contentView.innerHTML = "<p class='text-gray-500'>해당하는 내용을 찾을 수 없습니다.</p>";
            }
        }

        loadHistoryData();
    </script>
</body>
</html>
