<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>촛불회 회보 연혁 (History Viewer)</title>
    <!-- Tailwind CSS 적용 -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 마크다운 파싱을 위한 marked.js -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.js"></script>
    <style>
        body { font-family: 'Malgun Gothic', sans-serif; }
        .content-box ul { list-style-type: disc; padding-left: 20px; }
        .content-box li { margin-bottom: 8px; line-height: 1.6; }
        /* 체크박스 계층 구조 들여쓰기 스타일 */
        .sub-category { margin-left: 24px; margin-top: 4px; margin-bottom: 4px; display: none; }
        .sub-category.show { display: block; }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 min-h-screen flex flex-col">

    <!-- 상단 헤더 -->
    <header class="bg-amber-700 text-white p-4 shadow-md">
        <div class="max-w-6xl mx-auto flex justify-between items-center">
            <h1 class="text-xl font-bold">촛불회 회보 연혁 (History Viewer)</h1>
            <span class="text-xs bg-amber-800 px-3 py-1 rounded-full">history.md 연동</span>
        </div>
    </header>

    <main class="max-w-6xl mx-auto p-6 flex-grow w-full space-y-6">
        
        <!-- 슬라이드 4번 레이아웃 기반 분류 선택 영역 (상단 배치) -->
        <section class="bg-white p-5 rounded-lg shadow-sm border border-gray-200">
            <h2 class="font-bold text-gray-700 mb-4 border-b pb-2 text-base">분류 선택 (체크박스 레이아웃)</h2>
            
            <div id="filter-container" class="space-y-3 text-sm">
                <!-- [전체 보기] 체크박스 -->
                <div class="flex items-center space-x-2 font-semibold">
                    <input type="checkbox" id="chk-all" onchange="handleAllCheck(this)" class="w-4 h-4 text-amber-700 rounded border-gray-300 focus:ring-amber-600">
                    <label for="chk-all" class="cursor-pointer text-amber-800">[전체 보기]</label>
                </div>

                <!-- 대분류 및 소분류 항목 리스트 (슬라이드 4번 구상 반영) -->
                <div class="space-y-2 pl-2 border-l-2 border-gray-100">
                    
                    <!-- 1. 회보 정보 -->
                    <div>
                        <div class="flex items-center space-x-2">
                            <input type="checkbox" id="chk-info" value="info" onchange="handleCategoryCheck(this)" class="cat-chk w-4 h-4 text-amber-700 rounded border-gray-300">
                            <label for="chk-info" class="cursor-pointer font-bold text-gray-800">1. 회보 정보</label>
                        </div>
                    </div>

                    <!-- 2. 조직 및 체계 변화 -->
                    <div>
                        <div class="flex items-center space-x-2">
                            <input type="checkbox" id="chk-organization" value="organization" onchange="handleCategoryCheck(this)" class="cat-chk w-4 h-4 text-amber-700 rounded border-gray-300">
                            <label for="chk-organization" class="cursor-pointer font-bold text-gray-800">2. 조직 및 체계 변화</label>
                        </div>
                    </div>

                    <!-- 3. 주요 이벤트 및 마일스톤 -->
                    <div>
                        <div class="flex items-center space-x-2">
                            <input type="checkbox" id="chk-events" value="events" onchange="handleCategoryCheck(this)" class="cat-chk w-4 h-4 text-amber-700 rounded border-gray-300">
                            <label for="chk-events" class="cursor-pointer font-bold text-gray-800">3. 주요 이벤트 및 마일스톤</label>
                        </div>
                    </div>

                    <!-- 4. 주요 회의 -->
                    <div>
                        <div class="flex items-center space-x-2">
                            <input type="checkbox" id="chk-meetings" value="meetings" onchange="handleCategoryCheck(this)" class="cat-chk w-4 h-4 text-amber-700 rounded border-gray-300">
                            <label for="chk-meetings" class="cursor-pointer font-bold text-gray-800">4. 주요 회의</label>
                        </div>
                    </div>

                    <!-- 5. 봉사 활동 -->
                    <div>
                        <div class="flex items-center space-x-2">
                            <input type="checkbox" id="chk-volunteer" value="volunteer" onchange="handleCategoryCheck(this)" class="cat-chk w-4 h-4 text-amber-700 rounded border-gray-300">
                            <label for="chk-volunteer" class="cursor-pointer font-bold text-gray-800">5. 봉사 활동</label>
                        </div>
                    </div>

                    <!-- 6. 소집단 활동 -->
                    <div>
                        <div class="flex items-center space-x-2">
                            <input type="checkbox" id="chk-subgroups" value="subgroups" onchange="handleCategoryCheck(this)" class="cat-chk w-4 h-4 text-amber-700 rounded border-gray-300">
                            <label for="chk-subgroups" class="cursor-pointer font-bold text-gray-800">6. 소집단 활동</label>
                        </div>
                    </div>

                    <!-- 7. 인물 소식 -->
                    <div>
                        <div class="flex items-center space-x-2">
                            <input type="checkbox" id="chk-people" value="people" onchange="handleCategoryCheck(this)" class="cat-chk w-4 h-4 text-amber-700 rounded border-gray-300">
                            <label for="chk-people" class="cursor-pointer font-bold text-gray-800">7. 인물 소식</label>
                        </div>
                    </div>

                </div>
            </div>
        </section>

        <!-- 하단 본문 출력 박스 영역 -->
        <section class="bg-white p-6 rounded-lg shadow-sm border border-gray-200">
            <div id="loading" class="text-center py-10 text-gray-500">GitHub에서 history.md 데이터를 불러오는 중입니다...</div>
            <div id="content-view" class="content-box prose max-w-none text-sm hidden space-y-6"></div>
        </section>

    </main>

    <!-- 푸터 -->
    <footer class="bg-gray-100 text-center py-4 text-xs text-gray-500 border-t mt-8">
        촛불회 회보 아카이브 시스템 &copy; 2026
    </footer>

    <!-- 자바스크립트 로직 -->
    <script>
        let rawMarkdownText = "";
        // GitHub에 저장된 history.md Raw 파일 경로
        const historyMdUrl = "https://raw.githubusercontent.com/clclub1975/clmb/main/HOME2/history.md";

        // 페이지 로드 시 history.md 파일 가져오기
        async function loadHistoryData() {
            try {
                const response = await fetch(historyMdUrl);
                if (!response.ok) throw new Error("네트워크 응답 오류");
                rawMarkdownText = await response.text();
                
                document.getElementById('loading').style.display = 'none';
                const contentView = document.getElementById('content-view');
                contentView.style.display = 'block';
                
                // 초기 상태: 전체 보기 체크 및 렌더링
                document.getElementById('chk-all').checked = true;
                renderContent(['all']);
            } catch (error) {
                document.getElementById('loading').innerHTML = "데이터를 불러오는 데 실패했습니다. 파일 경로를 확인해 주세요.";
                console.error(error);
            }
        }

        // [전체 보기] 체크박스 제어
        function handleAllCheck(masterChk) {
            const catChks = document.querySelectorAll('.cat-chk');
            if (masterChk.checked) {
                catChks.forEach(chk => chk.checked = false);
                renderContent(['all']);
            } else {
                // 전체가 해제되었을 때 아무것도 선택 안 된 경우 처리
                contentViewClear();
            }
        }

        // 개별 카테고리 체크박스 제어
        function handleCategoryCheck(changedChk) {
            const masterChk = document.getElementById('chk-all');
            const catChks = document.querySelectorAll('.cat-chk');
            
            // 개별 항목이 체크되면 전체 보기 체크 해제
            if (changedChk.checked) {
                masterChk.checked = false;
            }

            // 체크된 항목들의 값 수집
            const selectedValues = Array.from(catChks)
                .filter(chk => chk.checked)
                .map(chk => chk.value);

            if (selectedValues.length === 0) {
                masterChk.checked = true;
                renderContent(['all']);
            } else {
                renderContent(selectedValues);
            }
        }

        // 선택된 카테고리들에 해당하는 섹션만 필터링하여 렌더링
        function renderContent(selectedIds) {
            const contentView = document.getElementById('content-view');

            if (selectedIds.includes('all')) {
                contentView.innerHTML = marked.parse(rawMarkdownText);
                return;
            }

            // history.md 내용을 '## ' 기준으로 섹션 분리
            const sections = rawMarkdownText.split('## ');
            let combinedHtml = "";

            selectedIds.forEach(id => {
                for (let sec of sections) {
                    // 앵커 ID나 대분류 번호 매칭 확인
                    if (sec.includes(`id="${id}"`) || sec.trim().startsWith(id.charAt(0))) {
                        combinedHtml += "## " + sec + "\n\n";
                        break;
                    }
                }
            });

            if (combinedHtml.trim() !== "") {
                contentView.innerHTML = marked.parse(combinedHtml);
            } else {
                contentView.innerHTML = "<p class='text-gray-500'>선택한 항목의 내용을 찾을 수 없습니다.</p>";
            }
        }

        function contentViewClear() {
            document.getElementById('content-view').innerHTML = "<p class='text-gray-500'>항목을 선택해 주세요.</p>";
        }

        // 실행
        loadHistoryData();
    </script>
</body>
</html>
