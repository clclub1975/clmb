<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>촛불회보 기고문 아카이브</title>
    <style>
        body { font-family: 'Segoe UI', AppleSDGothicNeo, sans-serif; max-width: 900px; margin: 40px auto; padding: 20px; line-height: 1.6; color: #333; background-color: #f9fafb; }
        h1 { text-align: center; color: #1f2937; margin-bottom: 10px; }
        p.subtitle { text-align: center; color: #6b7280; margin-bottom: 30px; }
        
        .filter-container { 
            display: flex; 
            gap: 15px; 
            background: #ffffff; 
            padding: 20px; 
            border-radius: 8px; 
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03); 
            margin-bottom: 25px; 
            flex-wrap: wrap;
        }
        .filter-group { 
            flex: 1; 
            min-width: 220px; 
        }
        label { 
            font-weight: 600; 
            display: block; 
            margin-bottom: 8px; 
            font-size: 14px; 
            color: #4b5563; 
        }
        select { 
            width: 100%; 
            padding: 10px 12px; 
            border-radius: 6px; 
            border: 1px solid #d1d5db; 
            font-size: 15px; 
            background-color: #fff;
            transition: border-color 0.15s ease-in-out;
        }
        select:focus { 
            border-color: #2563eb; 
            outline: none; 
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1); 
        }
        select:disabled {
            background-color: #f3f4f6;
            cursor: not-allowed;
        }
        
        #articleViewer { 
            background: #ffffff; 
            padding: 30px; 
            border-radius: 8px; 
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05); 
            border: 1px solid #e5e7eb; 
        }
        .meta-info { 
            font-size: 14px; 
            color: #4b5563; 
            background-color: #f3f4f6; 
            padding: 12px 16px; 
            border-radius: 6px; 
            margin-bottom: 20px; 
            border-left: 4px solid #2563eb;
            display: none;
        }
        #contentBody { 
            white-space: pre-wrap; 
            font-size: 16px; 
            color: #1f2937; 
            line-height: 1.8; 
        }
        .placeholder-text {
            color: #9ca3af;
            text-align: center;
            padding: 40px 0;
        }
    </style>
</head>
<body>

    <h1>촛불회보 기고문 아카이브</h1>
    <p class="subtitle">기수, 기고자, 기고문을 순서대로 선택하여 전문을 확인하세요.</p>

    <!-- 가로 배치형 필터 박스 -->
    <div class="filter-container">
        <!-- 1단계: 기수 선택 -->
        <div class="filter-group">
            <label for="cohortSelect">1. 기수 선택</label>
            <select id="cohortSelect" disabled>
                <option value="">데이터 불러오는 중...</option>
            </select>
        </div>

        <!-- 2단계: 기고자 선택 -->
        <div class="filter-group">
            <label for="authorSelect">2. 기고자 선택</label>
            <select id="authorSelect" disabled>
                <option value="">-- 기고자를 선택하세요 --</option>
            </select>
        </div>

        <!-- 3단계: 기고문 선택 -->
        <div class="filter-group">
            <label for="articleSelect">3. 기고문 선택</label>
            <select id="articleSelect" disabled>
                <option value="">-- 기고문을 선택하세요 --</option>
            </select>
        </div>
    </div>

    <!-- 기고문 전문 출력 영역 -->
    <div id="articleViewer">
        <div class="meta-info" id="metaInfo"></div>
        <div id="contentBody" class="placeholder-text">구글 시트에서 데이터를 불러오고 있습니다. 잠시만 기다려주세요.</div>
    </div>

    <script>
        const SHEET_CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vR6mZQwpFNu30Chf62zXmSiBGOE36xjEGRrhaW9p90W4M7BNT0xGKEbW3mrKSc9C1UfZwt9ry4MfOMN/pub?gid=251511332&single=true&output=csv';

        let articlesData = [];

        const cohortSelect = document.getElementById('cohortSelect');
        const authorSelect = document.getElementById('authorSelect');
        const articleSelect = document.getElementById('articleSelect');
        const metaInfo = document.getElementById('metaInfo');
        const contentBody = document.getElementById('contentBody');

        // 큰따옴표와 줄바꿈이 포함된 CSV 전문을 완벽하게 파싱하는 함수
        function parseCSV(text) {
            const rows = [];
            let row = [];
            let inQuotes = false;
            let field = '';
            
            for (let i = 0; i < text.length; i++) {
                let c = text[i];
                let next = text[i + 1];
                
                if (c === '"') {
                    if (inQuotes && next === '"') {
                        field += '"';
                        i++; // 따옴표 이스케이프 처리
                    } else {
                        inQuotes = !inQuotes;
                    }
                } else if (c === ',' && !inQuotes) {
                    row.push(field.trim());
                    field = '';
                } else if ((c === '\r' && next === '\n') && !inQuotes) {
                    row.push(field.trim());
                    rows.push(row);
                    row = [];
                    field = '';
                    i++; // \r\n 처리
                } else if (c === '\n' && !inQuotes) {
                    row.push(field.trim());
                    rows.push(row);
                    row = [];
                    field = '';
                } else {
                    field += c;
                }
            }
            if (field || row.length > 0) {
                row.push(field.trim());
                rows.push(row);
            }

            const result = [];
            // 첫 번째 줄(헤더)을 제외하고 데이터 매핑
            for (let i = 1; i < rows.length; i++) {
                const r = rows[i];
                if (r.length >= 8 && r[0]) {
                    result.push({
                        id: r[0],
                        vol: r[1],
                        date: r[2],
                        cohort: r[3],
                        author: r[4],
                        type: r[5],
                        title: r[6],
                        content: r[7] // H열 전문 내용을 가공 없이 통째로 반영
                    });
                }
            }
            return result;
        }

        // 구글 시트 데이터 비동기 로드
        async function loadSheetData() {
            try {
                const response = await fetch(SHEET_CSV_URL);
                const csvText = await response.text();
                articlesData = parseCSV(csvText);

                initDropdowns();
            } catch (error) {
                contentBody.textContent = '구글 시트 데이터를 불러오는 데 실패했습니다. 네트워크 연결을 확인해주세요.';
                console.error(error);
            }
        }

        function initDropdowns() {
            cohortSelect.innerHTML = '<option value="">-- 기수를 선택하세요 --</option><option value="전체">전체</option>';
            
            const cohortsWithAuthors = [...new Set(articlesData.map(item => item.cohort))].sort((a, b) => {
                if (a === "기록 없음") return 1;
                if (b === "기록 없음") return -1;
                return parseInt(a || 0) - parseInt(b || 0);
            });

            cohortsWithAuthors.forEach(cohort => {
                if (!cohort) return;
                const option = document.createElement('option');
                option.value = cohort;
                option.textContent = cohort;
                cohortSelect.appendChild(option);
            });

            cohortSelect.disabled = false;
            contentBody.textContent = '원하시는 기고문을 선택하시면 이곳에 전문이 표시됩니다.';
        }

        // 1단계: 기수 선택 시
        cohortSelect.addEventListener('change', function() {
            const selectedCohort = this.value;
            authorSelect.innerHTML = '<option value="">-- 기고자를 선택하세요 --</option>';
            articleSelect.innerHTML = '<option value="">-- 기고문을 선택하세요 --</option>';
            authorSelect.disabled = !selectedCohort;
            articleSelect.disabled = true;
            metaInfo.style.display = 'none';
            contentBody.className = 'placeholder-text';
            contentBody.textContent = '원하시는 기고문을 선택하시면 이곳에 전문이 표시됩니다.';

            if (!selectedCohort) return;

            let filteredAuthors = [];
            if (selectedCohort === "전체") {
                filteredAuthors = [...new Set(articlesData.map(item => item.author))].sort();
            } else {
                filteredAuthors = [...new Set(articlesData.filter(item => item.cohort === selectedCohort).map(item => item.author))].sort();
            }

            filteredAuthors.forEach(author => {
                const option = document.createElement('option');
                option.value = author;
                option.textContent = author;
                authorSelect.appendChild(option);
            });
        });

        // 2단계: 기고자 선택 시
        authorSelect.addEventListener('change', function() {
            const selectedCohort = cohortSelect.value;
            const selectedAuthor = this.value;
            articleSelect.innerHTML = '<option value="">-- 기고문을 선택하세요 --</option>';
            articleSelect.disabled = !selectedAuthor;
            metaInfo.style.display = 'none';
            contentBody.className = 'placeholder-text';
            contentBody.textContent = '원하시는 기고문을 선택하시면 이곳에 전문이 표시됩니다.';

            if (!selectedAuthor) return;

            let filteredArticles = [];
            if (selectedCohort === "전체") {
                filteredArticles = articlesData.filter(item => item.author === selectedAuthor);
            } else {
                filteredArticles = articlesData.filter(item => item.cohort === selectedCohort && item.author === selectedAuthor);
            }

            filteredArticles.forEach(article => {
                const option = document.createElement('option');
                option.value = article.id;
                option.textContent = article.title;
                articleSelect.appendChild(option);
            });
        });

        // 3단계: 기고문 선택 시 H열 전문 통째로 출력
        articleSelect.addEventListener('change', function() {
            const selectedId = this.value;
            if (!selectedId) {
                metaInfo.style.display = 'none';
                contentBody.className = 'placeholder-text';
                contentBody.textContent = '원하시는 기고문을 선택하시면 이곳에 전문이 표시됩니다.';
                return;
            }

            const article = articlesData.find(item => item.id === selectedId);
            if (article) {
                metaInfo.style.display = 'block';
                metaInfo.innerHTML = `<strong>[${article.title}]</strong> | 발행: ${article.vol} (${article.date}) | 기수: ${article.cohort} | 기고자: ${article.author} | 종류: ${article.type} | 관리번호: ${article.id}`;
                contentBody.className = '';
                contentBody.textContent = article.content; // H열의 원본 텍스트 그대로 반영
            }
        });

        loadSheetData();
    </script>
</body>
</html>
