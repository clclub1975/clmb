name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Inject API Key & Setup Git
        run: |
          sed -i 's/__SHARED_API_KEY__/${{ secrets.SHARED_GEMINI_API_KEY }}/g' index2.html
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.io"

      - name: Deploy to gh-pages branch
        run: |
          git checkout --orphan gh-pages
          git reset --soft
          git rm -rf --cached . || true
          git add index2.html
          git commit -m "Deploy v9.1 with injected API Key"
          git push origin gh-pages --force
