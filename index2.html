<!-- v3.9: 전체 열(Headers) 및 행 데이터 구조 정밀 검증 확장 Debug 코드 -->
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>촛불회 AI 추억 스토리 생성기 v3.9 (Debug)</title>
    <style>
        body { font-family: 'Malgun Gothic', sans-serif; max-width: 850px; margin: 40px auto; padding: 20px; line-height: 1.6; color: #333; }
        h1 { color: #2c3e50; text-align: center; }
        .version { font-size: 0.4em; color: #888; vertical-align: middle; margin-left: 10px; }
        .chat-container { border: 1px solid #ddd; border-radius: 8px; padding: 20px; background: #f9f9f9; }
        .debug-box { margin-top: 20px; padding: 15px; background: #fff; border: 1px solid #3498db; border-radius: 4px; white-space: pre-wrap; font-family: monospace; font-size: 13px; max-height: 450px; overflow-y: auto; }
    </style>
</head>
<body>
    <h1>🕯️ 촛불회 AI 추억 스토리 생성기<span class="version">v3.9 (Debug)</span></h1>
    <div class="chat-container">
        <h3>🔍 전체 컬럼 및 행 데이터 구조 정밀 검증 결과</h3>
        <div id="debugResult" class="debug-box">전체 데이터를 매핑하는 중입니다...</div>
    </div>

    <script>
        const CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vR-cuFQ89zh4t6L-_m_-ktGAYFgVz8lBeyHZFnPK2UDQHOe84sPzBkEdMlj-5tvX-41v9oB7n0B94dP/pub?gid=1769103197&single=true&output=csv";

        function parseCSVStrict(text) {
            let rows = [];
            let currentRow = [];
            let currentField = "";
            let inQuotes = false;

            for (let i = 0; i < text.length; i++) {
                let c = text[i];
                let nextC = text[i + 1];

                if (inQuotes) {
                    if (c === '"') {
                        if (nextC === '"') {
                            currentField += '"';
                            i++;
                        } else {
                            inQuotes = false;
                        }
                    } else {
                        currentField += c;
                    }
                } else {
                    if (c === '"') {
                        inQuotes = true;
                    } else if (c === ',') {
                        currentRow.push(currentField.trim());
                        currentField = "";
                    } else if (c === '\r' && nextC === '\n') {
                        currentRow.push(currentField.trim());
                        rows.push(currentRow);
                        currentRow = [];
                        currentField = "";
                        i++;
                    } else if (c === '\n') {
                        currentRow.push(currentField.trim());
                        rows.push(currentRow);
                        currentRow = [];
                        currentField = "";
                    } else {
                        currentField += c;
                    }
                }
            }
            if (currentField !== "" || currentRow.length > 0) {
                currentRow.push(currentField.trim());
                rows.push(currentRow);
            }
            return rows;
        }

        window.onload = async function() {
            try {
                const response = await fetch(CSV_URL + "&t=" + new Date().getTime());
                const csvText = await response.text();
                
                let table = parseCSVStrict(csvText);
                if (table.length === 0) throw new Error("CSV 데이터가 비어있습니다.");

                let headers = table[0];
                let structuredData = [];

                // 각 행을 헤더와 매칭하여 JSON 객체 배열 형태로 변환 테스트
                for (let i = 1; i < table.length; i++) {
                    let cols = table[i];
                    if (!cols || cols.length === 0 || (cols.length === 1 && cols[0] === "")) continue;

                    let rowObj = {};
                    for (let j = 0; j < headers.length; j++) {
                        let headerName = headers[j] || `Col_${j}`;
                        rowObj[headerName] = cols[j] || "";
                    }
                    structuredData.push(rowObj);
                }

                // 결과 출력 리포트 작성
                let report = `[시트 전체 헤더 항목 목록 (${headers.length}개 컬럼)]\n${JSON.stringify(headers, null, 2)}\n\n`;
                report += `[파싱된 전체 데이터 행 수]: ${structuredData.length}개\n\n`;
                report += `[전체 행 데이터 JSON 객체 매핑 결과 샘플]\n${JSON.stringify(structuredData, null, 2)}`;

                document.getElementById("debugResult").innerHTML = report;

            } catch (error) {
                document.getElementById("debugResult").innerHTML = `<span style="color:red;">[에러 발생] ${error.message}</span>`;
            }
        };
    </script>
</body>
</html>
