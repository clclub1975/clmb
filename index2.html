<!-- v3.10: B열(발행년월) 연도 추출 및 최소/최대 연도 계산 정밀 검증 Debug 코드 -->
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>촛불회 AI 추억 스토리 생성기 v3.10 (Debug)</title>
    <style>
        body { font-family: 'Malgun Gothic', sans-serif; max-width: 850px; margin: 40px auto; padding: 20px; line-height: 1.6; color: #333; }
        h1 { color: #2c3e50; text-align: center; }
        .version { font-size: 0.4em; color: #888; vertical-align: middle; margin-left: 10px; }
        .chat-container { border: 1px solid #ddd; border-radius: 8px; padding: 20px; background: #f9f9f9; }
        .debug-box { margin-top: 20px; padding: 15px; background: #fff; border: 1px solid #3498db; border-radius: 4px; white-space: pre-wrap; font-family: monospace; font-size: 13px; max-height: 450px; overflow-y: auto; }
    </style>
</head>
<body>
    <h1>🕯️ 촛불회 AI 추억 스토리 생성기<span class="version">v3.10 (Debug)</span></h1>
    <div class="chat-container">
        <h3>🔍 B열(발행년월) 연도 추출 및 최소/최대값 검증 결과</h3>
        <div id="debugResult" class="debug-box">B열 데이터를 분석하는 중입니다...</div>
    </div>

    <script>
        const CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vR-cuFQ89zh4t6L-_m_-ktGAYFgVz8lBeyHZFnPK2UDQHOe84sPzBkEdMlj-5tvX-41v9oB7n0B94dP/pub?gid=1769103197&single=true&output=csv";

        function parseCSVStrict(text) {
            let rows = [];
            let currentRow = [];
            let currentField = "";
            let inQuotes = false;

            for (let i = 0; i < text.length; i++) {
                let c = text[i];
                let nextC = text[i + 1];

                if (inQuotes) {
                    if (c === '"') {
                        if (nextC === '"') {
                            currentField += '"';
                            i++;
                        } else {
                            inQuotes = false;
                        }
                    } else {
                        currentField += c;
                    }
                } else {
                    if (c === '"') {
                        inQuotes = true;
                    } else if (c === ',') {
                        currentRow.push(currentField.trim());
                        currentField = "";
                    } else if (c === '\r' && nextC === '\n') {
                        currentRow.push(currentField.trim());
                        rows.push(currentRow);
                        currentRow = [];
                        currentField = "";
                        i++;
                    } else if (c === '\n') {
                        currentRow.push(currentField.trim());
                        rows.push(currentRow);
                        currentRow = [];
                        currentField = "";
                    } else {
                        currentField += c;
                    }
                }
            }
            if (currentField !== "" || currentRow.length > 0) {
                currentRow.push(currentField.trim());
                rows.push(currentRow);
            }
            return rows;
        }

        window.onload = async function() {
            try {
                const response = await fetch(CSV_URL + "&t=" + new Date().getTime());
                const csvText = await response.text();
                
                let table = parseCSVStrict(csvText);
                if (table.length === 0) throw new Error("CSV 데이터가 비어있습니다.");

                let headers = table[0];
                let colB_Name = headers[1] || "B열";

                let rawB = [];
                let parsedYears = [];

                // 2행부터 B열(인덱스 1) 순회
                for (let i = 1; i < table.length; i++) {
                    let cols = table[i];
                    if (!cols || cols.length < 2) continue;

                    let valB = cols[1] || "";
                    rawB.push(valB);

                    // B열에서 4자리 연도 패턴(19xx 또는 20xx) 추출
                    let match = valB.match(/(19[8-9][0-9]|20[0-9][0-9])/);
                    if (match) {
                        let y = parseInt(match[0], 10);
                        if (!isNaN(y)) parsedYears.push(y);
                    }
                }

                // B열 연도 최소값/최대값 계산
                let minYear = parsedYears.length > 0 ? Math.min(...parsedYears) : "없음";
                let maxYear = parsedYears.length > 0 ? Math.max(...parsedYears) : "없음";

                // 결과 출력 리포트
                let report = `[타겟 컬럼 정보]\n- 두 번째 열 이름 (B열): "${colB_Name}"\n\n`;
                report += `[B열(발행년월) 원본 값 목록]\n${JSON.stringify(rawB, null, 2)}\n\n`;
                report += `[B열에서 추출한 순수 연도 목록]\n${JSON.stringify(parsedYears, null, 2)}\n\n`;
                report += `🎯 B열 최종 계산된 최소 연도: ${minYear}년 / 최대 연도: ${maxYear}년`;

                document.getElementById("debugResult").innerHTML = report;

            } catch (error) {
                document.getElementById("debugResult").innerHTML = `<span style="color:red;">[에러 발생] ${error.message}</span>`;
            }
        };
    </script>
</body>
</html>
